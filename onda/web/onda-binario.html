<meta name="claude:viewport-fit-sides" content="cover">
<title>Onda · Binário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  :root{--ink:#eaf0ff;--mut:#9fb0d8;--card:#141a2e;--line:#283255;--acc:#7ee0ff;--acc2:#b98cff;
    --f:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;color-scheme:dark}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1000px 700px at 50% -10%,#1a2350,transparent 60%),linear-gradient(180deg,#0a0e1c,#0d1228);
    color:var(--ink);font:15px/1.45 var(--f);-webkit-tap-highlight-color:transparent;min-height:100vh}
  .wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
    padding:max(18px,env(safe-area-inset-top,0px)) 18px max(20px,env(safe-area-inset-bottom,0px))}
  h1{margin:0;text-align:center;font-size:24px;font-weight:800}
  h1 small{display:block;font-size:13px;font-weight:700;color:var(--mut)}
  .art{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;border:1px solid var(--line);
    background:#05070f;box-shadow:0 24px 60px -30px rgba(100,130,255,.5)}
  .art canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
  .art .run{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}
  .st b{display:block;font-size:19px;font-weight:800}
  .st span{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .flow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;color:var(--mut);font-weight:700;font-size:13.5px;line-height:1.5}
  .flow b{color:var(--ink)}
  .flow .acc{color:var(--acc)}
  button{border:0;border-radius:16px;color:#071018;font:800 17px var(--f);padding:14px 0;cursor:pointer;
    background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 14px 28px -12px var(--acc2)}
  button:active{transform:translateY(2px)}
</style>
<div class="wrap">
  <h1>Onda · Binário <small>o grafo no sítio ótimo</small></h1>
  <div class="art"><canvas id="cv" width="360" height="360"></canvas><div class="run" id="run">a correr…</div></div>
  <div class="stats">
    <div class="st"><b id="sz">—</b><span>WASM</span></div>
    <div class="st"><b id="ms">—</b><span>correr</span></div>
    <div class="st"><b>0</b><span>parser</span></div>
  </div>
  <div class="flow">A IA emitiu o <b>grafo</b> → a Onda compilou para <b class="acc" id="szf">—</b> de <b>WASM</b> → o teu telemóvel só <b>valida e corre</b>.<br>Sem fonte. Sem parser. Sem compilador no aparelho.</div>
  <button id="again">▶ Correr outra vez</button>
</div>

  // host minimo (so tres portas: sys, m1, m2) -- o mesmo contrato do ondac.js
  function runWasm(){
    var out=[], mem=null, kbrk=-1;
    function words(a,n){return new BigInt64Array(mem.buffer,(Number(a)+16)*8,n);}
    var sys=function(c,a,b){c=Number(c);
      if(c===0){var n=Number(b),v=words(a,n);for(var i=0;i<n;i++)out.push(Number(v[i]&255n));return 0n;}

      if(c===6)return BigInt(Math.round(performance.now()*1000));
      if(c===7){var need=(Number(a)+16)*8;if(need>mem.buffer.byteLength)mem.grow(Math.ceil((need-mem.buffer.byteLength)/65536));return BigInt(mem.buffer.byteLength/8-16);}

      return 0n;};

      try{r.instance.exports._start();}catch(e){if(e.ondaExit===undefined)throw e;}
      var ms=performance.now()-t0;
      var d=img.data;
      for(var p=0,o=0;p<out.length;p+=3,o+=4){d[o]=out[p];d[o+1]=out[p+1];d[o+2]=out[p+2];d[o+3]=255;}
      ctx.putImageData(img,0,0);
      msEl.textContent=ms.toFixed(0)+' ms'; runEl.style.display='none';
    });
  }
  document.getElementById('again').onclick=function(){runEl.textContent='a correr…';runEl.style.display='grid';setTimeout(runWasm,30);};
