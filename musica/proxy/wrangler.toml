name = "musica"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Tokens do Tidal, chaves dos aparelhos, perfil de gosto, biblioteca de playlists e pedidos
# (criado com: POST /accounts/:id/storage/kv/namespaces {"title":"musica-KV"})
# As tendências: o retrato das tabelas públicas (Apple Music, Deezer), uma vez por dia
[triggers]
crons = ["23 4 * * *"]

# A IA da Cloudflare (Workers AI): as músicas de partida de um pedido escrito (grátis até 10 000 «Neurons» por dia)
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "KV"
id = "f3574d08325242b88f73354859b291ff"

# Histórico em SQL (D1): as tabelas de cada dia (o KV apaga-as aos 70 dias) e as versões do perfil do dono.
[[d1_databases]]
binding = "HIST"
database_name = "musica-historico"
database_id = "54cbaadc-3661-4a6e-a558-28fa4433501c"

[vars]
APP_URL = "https://nelsonsous.github.io/escolaplay/musica/"
PAIS = "PT"
# Client ID da app registada em developer.tidal.com (público; o fluxo é PKCE, sem segredo).
# Normalmente fica vazio: cola-se na app (com o código de ligação) e fica na KV (config:tidal_client_id).
# Redirect URI a registar lá: https://musica.mercados-proxy.workers.dev/tidal/retorno
TIDAL_CLIENT_ID = ""
