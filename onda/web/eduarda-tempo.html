<meta name="claude:viewport-fit-sides" content="cover">
<title>Eduarda Viajante do Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* Jogo de estudo para 8 anos: portal do tempo (campo Onda na GPU) por trás; cartões grandes, estrelas e confete. Tema mágico escuro. */
  :root{
    --bg:#140a2e; --card:#241552e0; --card2:#2e1a66; --line:#4a2f8f;
    --fg:#fdf4ff; --mut:#c9b6f0;
    --pink:#ff6fc7; --amber:#ffc94d; --cyan:#5ad9ff; --green:#4ce0a4; --violet:#b48cff;
    color-scheme:dark;
    --f:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:#140a2e;color:var(--fg);font:17px/1.4 var(--f);overflow:hidden;-webkit-tap-highlight-color:transparent}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
  .wrap{position:relative;z-index:2;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;margin-bottom:10px}
  .stars{font-weight:800;font-size:19px;letter-spacing:1px}
  .stars b{color:var(--amber)}
  .bar{flex:1;height:14px;border-radius:999px;background:#ffffff22;overflow:hidden;margin-left:4px}
  .bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--pink));transition:width .4s cubic-bezier(.3,1,.4,1)}
  .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px 20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 20px 60px -24px #000, 0 0 44px -20px var(--violet);display:flex;flex-direction:column;gap:16px;text-align:center}
  .icon{font-size:clamp(54px,18vw,86px);line-height:1;filter:drop-shadow(0 6px 16px #0008)}
  .q{font-size:clamp(20px,5.5vw,26px);font-weight:800;text-wrap:balance;line-height:1.2}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opts.two{flex-direction:row}
  .opt{flex:1;font:800 clamp(18px,5vw,22px)/1.1 var(--f);color:#1a0a2e;border:0;border-radius:18px;padding:16px 12px;cursor:pointer;
    background:linear-gradient(135deg,#fff,#ffe3f4);box-shadow:0 8px 0 -2px #0005, 0 10px 24px -10px var(--pink);transition:transform .08s}
  .opt:nth-child(2){background:linear-gradient(135deg,#fff,#e3f6ff);box-shadow:0 8px 0 -2px #0005,0 10px 24px -10px var(--cyan)}
  .opt:nth-child(3){background:linear-gradient(135deg,#fff,#fff0d6);box-shadow:0 8px 0 -2px #0005,0 10px 24px -10px var(--amber)}
  .opt:active{transform:translateY(3px) scale(.99)}
  .opt.good{background:linear-gradient(135deg,#d6ffe9,#4ce0a4)!important;animation:pop .4s}
  .opt.bad{animation:shake .4s}
  @keyframes pop{40%{transform:scale(1.08)}}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .feed{min-height:30px;font-weight:800;font-size:19px;text-wrap:balance}
  .feed.ok{color:var(--green)} .feed.no{color:var(--amber)}
  .feed small{display:block;font-weight:700;font-size:15px;color:var(--mut);margin-top:3px}
  .big{font:800 clamp(30px,9vw,44px)/1 var(--f);background:linear-gradient(100deg,var(--cyan),var(--pink) 55%,var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--mut);font-size:17px;font-weight:700;text-wrap:balance}
  .play{font:800 22px var(--f);color:#1a0a2e;border:0;border-radius:20px;padding:16px 34px;cursor:pointer;align-self:center;
    background:linear-gradient(120deg,var(--amber),var(--pink));box-shadow:0 10px 0 -2px #0005,0 14px 30px -10px var(--pink)}
  .play:active{transform:translateY(3px)}
  .hello{font-size:clamp(26px,7vw,36px);font-weight:800}
  .muted{color:var(--mut);font-weight:700}
  [hidden]{display:none!important}
</style>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top" id="hud" hidden>
    <div class="stars">⭐ <b id="sc">0</b></div>
    <div class="bar"><span id="prog"></span></div>
  </div>

  <div class="mid">
    <!-- INÍCIO -->
    <div class="panel" id="startP">
      <div class="icon">🕰️✨</div>
      <div class="big">Viajante do Tempo</div>
      <div class="hello">Olá, Eduarda! 👋</div>
      <div class="sub">Vamos viajar do antigamente até hoje, com séculos, números romanos e a nossa terra. Ganha estrelas a cada acerto!</div>
      <button class="play" id="go">Começar a viagem 🚀</button>
    </div>

    <!-- PERGUNTA -->
    <div class="panel" id="quizP" hidden>
      <div class="icon" id="qi">❓</div>
      <div class="q" id="qt">...</div>
      <div class="opts" id="qo"></div>
      <div class="feed" id="fb"></div>
    </div>

    <!-- FIM -->
    <div class="panel" id="endP" hidden>
      <div class="icon" id="endi">🏆</div>
      <div class="big" id="endt">Conseguiste!</div>
      <div class="sub" id="ends"></div>
      <button class="play" id="again">Jogar outra vez 🔁</button>
    </div>
  </div>
</div>

  var PRAISE=["Boa, Eduarda! 🌟","Certíssimo! 🎉","És uma craque! ⭐","Fantástico! 💫","Acertaste! 🥳"];

  var startP=document.getElementById('startP'), quizP=document.getElementById('quizP'), endP=document.getElementById('endP'), hud=document.getElementById('hud');
  var qi=document.getElementById('qi'), qt=document.getElementById('qt'), qo=document.getElementById('qo'), fb=document.getElementById('fb');
  var scEl=document.getElementById('sc'), prog=document.getElementById('prog');
  var order=[], idx=0, score=0, locked=false;

  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function start(){ order=shuffle(Q.map(function(_,i){return i;})); idx=0; score=0; scEl.textContent='0';
    startP.hidden=true; endP.hidden=true; hud.hidden=false; quizP.hidden=false; show(); }
  function show(){
    locked=false; fb.textContent=''; fb.className='feed';
    var q=Q[order[idx]]; qi.textContent=q.i; qt.textContent=q.q;
    prog.style.width=(idx/Q.length*100)+'%';
    qo.className='opts'+(q.o.length===2?' two':''); qo.innerHTML='';
    q.o.forEach(function(op){ var b=document.createElement('button'); b.className='opt'; b.textContent=op[0];
      b.onclick=function(){ pick(b,op[1],q); }; qo.appendChild(b); });
  }
  function pick(btn,ok,q){
    if(locked) return;
    if(ok){ locked=true; btn.classList.add('good'); score++; scEl.textContent=score;
      fb.className='feed ok'; fb.textContent=PRAISE[(Math.random()*PRAISE.length)|0];
      prog.style.width=((idx+1)/Q.length*100)+'%'; confetti(46);
      setTimeout(function(){ idx++; if(idx>=Q.length) end(); else show(); }, 1150);
    } else { btn.classList.add('bad'); setTimeout(function(){btn.classList.remove('bad');},400);
      fb.className='feed no'; fb.innerHTML='Quase! Tenta outra vez.<small>💡 '+q.d+'</small>'; }
  }
  function end(){
    quizP.hidden=true; endP.hidden=false;
    var e=document.getElementById('endi'), tt=document.getElementById('endt'), ss=document.getElementById('ends');
    e.textContent = score>=Q.length ? '🏆' : (score>=Q.length*0.6?'🌟':'📚');
    tt.textContent = score>=Q.length ? 'Perfeito!' : 'Muito bem!';
    ss.innerHTML = 'Ganhaste <b>'+score+' de '+Q.length+'</b> estrelas ⭐<br>'+(score>=Q.length?'Sabes tudo sobre a viagem no tempo!':'Joga outra vez para apanhares as estrelas que faltam.');
    confetti(120);
  }
  document.getElementById('go').onclick=start;
  document.getElementById('again').onclick=start;
})();
