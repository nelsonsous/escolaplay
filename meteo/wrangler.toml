name = "meteo"
main = "src/index.js"
compatibility_date = "2026-10-01"

# A PWA (public/) é embutida no Worker por scripts/build-static.mjs (corre antes de cada deploy/dev)
[build]
command = "node scripts/build-static.mjs"
watch_dir = "public"

# Locais, análises do Claude, lições e histórico de observações
# (criado com: POST /accounts/:id/storage/kv/namespaces {"title":"meteo-METEO"})
[[kv_namespaces]]
binding = "KV"
id = "df3dfce3ae1b40cdb97071b58df3e7b0"

[vars]
CLAUDE_MODEL = "claude-opus-5-5"

# Opcional — análise imediata pela API do Claude (botão "Analisar agora"):
#   npx wrangler secret put ANTHROPIC_API_KEY
