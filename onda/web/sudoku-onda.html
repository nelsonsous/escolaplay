<meta name="claude:viewport-fit-sides" content="cover">
<title>Sudoku Onda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* So layout e texto: TODOS os graficos do tabuleiro sao desenhados pela linguagem Onda
     (campo compilado da RI directamente para GLSL, sem parser, a correr na GPU). */
  html,body{margin:0;height:100%;background:#eef1fb;overflow:hidden;
    font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;
    padding:max(14px,env(safe-area-inset-top,0px)) 18px 0;text-align:center;color:#2a3657}
  .hud b{font-size:24px;font-weight:800}
  .hud b small{font-weight:700;color:#6b77a0;font-size:13px}
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;gap:10px;justify-content:center;
    padding:0 18px max(16px,env(safe-area-inset-bottom,0px));}
  .foot button{pointer-events:auto;border:0;border-radius:15px;font:800 16px "Baloo 2",sans-serif;color:#fff;
    padding:13px 22px;background:linear-gradient(120deg,#5b7cff,#9a5cff);box-shadow:0 10px 22px -12px #6a6aff}
  .foot button.g{background:linear-gradient(120deg,#ffa43a,#ff5f9e);box-shadow:0 10px 22px -12px #ff6aa0}
  .foot button:active{transform:translateY(2px)}
  .tip{position:fixed;left:0;right:0;bottom:74px;z-index:2;text-align:center;color:#6b77a0;font-weight:700;font-size:14px;pointer-events:none}
  .ov{position:fixed;inset:0;z-index:3;display:none;place-items:center;text-align:center;color:#2a3657;
    background:rgba(238,241,251,.72);backdrop-filter:blur(4px)}
  .ov.show{display:grid}
  .ov h1{margin:0;font-size:40px;font-weight:800;color:#2a3657}
  .ov p{margin:8px 0 20px;color:#6b77a0;font-weight:700}
  .ov button{border:0;border-radius:16px;color:#fff;font:800 18px "Baloo 2",sans-serif;padding:14px 30px;
    background:linear-gradient(120deg,#5b7cff,#9a5cff)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<canvas id="c"></canvas>
<div class="hud"><b>Sudoku <small>da Eduarda · feito com Onda</small></b></div>
<div class="tip" id="tip">Toca numa casa. Toca outra vez para mudar o número.</div>
<div class="foot">
  <button class="g" id="novo">✨ Novo</button>
  <button id="erase">🧽 Apagar</button>
</div>
<div class="ov" id="ov"><div><h1>🎉 Boa, Eduarda!</h1><p id="ovsub">Resolveste o Sudoku</p><button id="again">Jogar outra vez</button></div></div>

<script>
(function(){
  var cv=document.getElementById('c'), gl=cv.getContext('webgl2',{antialias:false,alpha:false});
  if(!gl){ document.getElementById('tip').textContent='O teu navegador nao suporta WebGL2.'; return; }
  var frag=document.getElementById('frag').textContent;
  var vs='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
    if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(x));return x;}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,frag));
  gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);gl.useProgram(pr);
  var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  var uLoc=gl.getUniformLocation(pr,'u');
  var W,H,DPR;
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.width=Math.round(innerWidth*DPR);H=cv.height=Math.round(innerHeight*DPR);
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';gl.viewport(0,0,W,H);}
  resize();addEventListener('resize',resize);

  // ---- jogo 4x4 ----
  var N=4,bR=2,bC=2, sol=[],grid=[],given=[],sel=-1;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function genFull(){var g=[];for(var i=0;i<N;i++)g.push(new Array(N).fill(0));
    function ok(r,c,v){for(var i=0;i<N;i++)if(g[r][i]===v||g[i][c]===v)return false;
      var r0=((r/bR)|0)*bR,c0=((c/bC)|0)*bC;for(var a=0;a<bR;a++)for(var b=0;b<bC;b++)if(g[r0+a][c0+b]===v)return false;return true;}
    function fill(p){if(p===N*N)return true;var r=(p/N)|0,c=p%N,ns=shuffle(Array.from({length:N},function(_,i){return i+1;}));
      for(var k=0;k<ns.length;k++){var v=ns[k];if(ok(r,c,v)){g[r][c]=v;if(fill(p+1))return true;g[r][c]=0;}}return false;}
    fill(0);var o=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)o.push(g[r][c]);return o;}
  function conflict(i){var v=grid[i];if(!v)return false;var r=(i/N)|0,c=i%N;
    for(var k=0;k<N;k++){if(k!==c&&grid[r*N+k]===v)return true;if(k!==r&&grid[k*N+c]===v)return true;}
    var r0=((r/bR)|0)*bR,c0=((c/bC)|0)*bC;for(var a=0;a<bR;a++)for(var b=0;b<bC;b++){var j=(r0+a)*N+(c0+b);if(j!==i&&grid[j]===v)return true;}return false;}
  function newGame(){sol=genFull();grid=sol.slice();given=new Array(16).fill(true);
    shuffle(Array.from({length:16},function(_,i){return i;})).slice(0,6).forEach(function(i){grid[i]=0;given[i]=false;});
    sel=-1;document.getElementById('ov').classList.remove('show');}
  function pack(){var d=[0,0,0];for(var i=0;i<16;i++){var wf=(i/7)|0,pos=i-wf*7;d[wf]+=(grid[i]||0)*Math.pow(10,pos);}
    var giv=0;for(var i=0;i<16;i++)if(given[i])giv+=Math.pow(2,i);return [d[0],d[1],d[2],giv];}
  function win(){for(var i=0;i<16;i++){if(!grid[i]||conflict(i))return false;}return true;}

  function cellAt(cssx,cssy){var x=cssx*DPR,y=cssy*DPR,aw=W/H,SB=0.94*aw,bx0=(aw-SB)/2,by0=0.5-SB/2;
    var lx=(x/H-bx0)/SB,ly=(y/H-by0)/SB;if(lx<0||lx>=1||ly<0||ly>=1)return -1;
    return ((ly*4)|0)*4+((lx*4)|0);}
  function tap(cssx,cssy){var c=cellAt(cssx,cssy);if(c<0){sel=-1;return;}
    if(given[c]){sel=c;return;}
    if(sel===c){grid[c]=(grid[c]+1)%5;if(win())setTimeout(youWin,180);}else sel=c;}
  function youWin(){document.getElementById('ov').classList.add('show');try{navigator.vibrate([0,40,60,40]);}catch(e){}}

  cv.addEventListener('pointerdown',function(e){e.preventDefault();var r=cv.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top);},{passive:false});
  document.getElementById('novo').onclick=newGame;
  document.getElementById('again').onclick=newGame;
  document.getElementById('erase').onclick=function(){if(sel>=0&&!given[sel]){grid[sel]=0;}};

  newGame();
  function frame(ms){requestAnimationFrame(frame);var p=pack();
    gl.uniform1fv(uLoc,[ms/1000,W,H,p[0],p[1],p[2],sel,p[3]]);
    gl.drawArrays(gl.TRIANGLES,0,3);}
  requestAnimationFrame(frame);
})();
