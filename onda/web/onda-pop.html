<meta name="claude:viewport-fit-sides" content="cover">
<title>Onda Pop</title>
<style>
  /* Jogo de arcada: o campo da Onda (GPU) é o palco vivo; orbes por cima. Tema único escuro — o campo brilha. */
  :root{
    --bg:#140a1e; --panel:#1d1030cc; --line:#3a2152;
    --fg:#fbe9f4; --mut:#c8a0d2;
    --pink:#f472b6; --amber:#f59e0b; --cyan:#5ad1c6; --green:#34d399;
    color-scheme:dark;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(130% 90% at 50% -8%,#311451 0%,var(--bg) 58%) fixed;color:var(--fg);font:16px/1.5 var(--sans);overflow:hidden}
  .wrap{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
    padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px));
    padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex:0 0 auto}
  .brand{font:800 18px/1 var(--sans);letter-spacing:-.01em;
    background:linear-gradient(100deg,var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand small{display:block;font:600 9.5px/1.4 var(--mono);letter-spacing:.12em;color:var(--cyan);-webkit-text-fill-color:var(--cyan)}
  .hud{display:flex;gap:8px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 11px;text-align:center;min-width:58px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pill .k{font:700 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .pill .v{font:800 19px/1.1 var(--sans);margin-top:3px;font-variant-numeric:tabular-nums}
  #time .v{color:var(--cyan)} #combo .v{color:var(--amber)}
  .stage{position:relative;flex:1 1 auto;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#000;min-height:0;
    box-shadow:0 24px 70px -30px #000,0 0 44px -20px var(--pink)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #orbs{position:absolute;inset:0;touch-action:none}
  .orb{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform,opacity;
    box-shadow:0 0 18px 4px var(--g,#fff),inset 0 0 10px 2px #ffffffcc;
    background:radial-gradient(circle at 38% 34%,#fff 0 22%,var(--g,#fff) 60%,transparent 72%)}
  .score-fx{position:absolute;transform:translate(-50%,-50%);font:800 18px var(--sans);color:#fff;text-shadow:0 1px 6px #000;pointer-events:none;animation:rise .7s ease-out forwards}
  @keyframes rise{to{transform:translate(-50%,-150%);opacity:0}}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:28px;
    background:radial-gradient(90% 70% at 50% 40%,#1d1030e6,#140a1ef2);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
  .screen h1{margin:0;font:800 clamp(34px,11vw,52px)/1 var(--sans);letter-spacing:-.02em;
    background:linear-gradient(100deg,var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .screen p{margin:0;color:var(--mut);max-width:30ch;font-size:15px}
  .screen .big{font:800 56px/1 var(--sans);color:var(--fg);font-variant-numeric:tabular-nums}
  .screen .big small{display:block;font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
  button{font:800 18px var(--sans);color:#1a0a12;background:linear-gradient(120deg,var(--pink),var(--amber));border:0;border-radius:16px;padding:14px 30px;cursor:pointer;
    box-shadow:0 10px 30px -10px var(--pink);-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.96)}
  .foot{flex:0 0 auto;text-align:center;color:var(--mut);font-size:11.5px;margin-top:9px}
  .foot b{color:var(--pink)}
  [hidden]{display:none!important}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">Onda&nbsp;Pop<small>GPU · Onda</small></div>
    <div class="hud">
      <div class="pill" id="scoreP"><div class="k">Pontos</div><div class="v" id="score">0</div></div>
      <div class="pill" id="combo"><div class="k">Combo</div><div class="v" id="comboV">×1</div></div>
      <div class="pill" id="time"><div class="k">Tempo</div><div class="v" id="timev">30</div></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="orbs"></div>

    <div class="screen" id="startS">
      <h1>Onda Pop</h1>
      <p>Toca nas bolhas antes que desapareçam. Encadeia-as para combos. O campo todo é a <b>Onda</b> a correr na tua GPU.</p>
      <button id="startB">Jogar</button>
    </div>

    <div class="screen" id="overS" hidden>
      <div class="big"><small>Pontos</small><span id="finalScore">0</span></div>
      <p id="bestLine">Recorde: 0</p>
      <button id="againB">Outra vez</button>
    </div>
  </div>

  <div class="foot">Motor gráfico: função <b>Onda</b> → <code>ondac -g</code> → GLSL → GPU · ~500 mil campos/frame</div>
</div>

<script>
(function(){
  var cv=document.getElementById('c'), stage=document.getElementById('stage'), orbsEl=document.getElementById('orbs');
  var gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
  var scoreEl=document.getElementById('score'), comboEl=document.getElementById('comboV'), timeEl=document.getElementById('timev');
  var startS=document.getElementById('startS'), overS=document.getElementById('overS');

  // ---- WebGL: shader da Onda ----
  var hasGL=!!gl, uLoc=null, W=1,H=1;
  if(hasGL){
    var VS='#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';
    var FS=document.getElementById('frag').textContent;
    function sh(ty,s){var o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o;}
    var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){hasGL=false;} else { gl.useProgram(pr); uLoc=gl.getUniformLocation(pr,'u'); gl.bindVertexArray(gl.createVertexArray()); }
  }
  if(!hasGL){ stage.style.background='radial-gradient(circle at 50% 40%,#3a1550,#140a1e)'; }
  function resize(){ if(!hasGL) return; var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    var s=Math.max(64,Math.min(Math.round(Math.min(r.width,r.height)*dpr),860)); if(s!==W){W=H=s;cv.width=W;cv.height=H;gl.viewport(0,0,W,H);} }
  window.addEventListener('resize',resize,{passive:true});

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ripple do último toque (em fração 0..1 do palco)
  var rx=0.5, ry=0.5, rt=-9;

  // ---- Estado do jogo ----
  var state='start', score=0, combo=1, comboUntil=0, tEnd=0, lastSpawn=0, orbs=[], best=0;
  try{ best=parseInt(localStorage.getItem('ondapop_best')||'0',10)||0; }catch(e){}
  function fmtBest(){ document.getElementById('bestLine').textContent='Recorde: '+best; }

  function start(){
    score=0;combo=1;comboUntil=0;state='play';tEnd=performance.now()+30000;lastSpawn=0;
    orbs.forEach(function(o){o.el.remove();}); orbs=[];
    startS.hidden=true; overS.hidden=true; scoreEl.textContent='0'; comboEl.textContent='×1';
  }
  function over(){
    state='over'; orbs.forEach(function(o){o.el.remove();}); orbs=[];
    if(score>best){best=score;try{localStorage.setItem('ondapop_best',String(best));}catch(e){}}
    document.getElementById('finalScore').textContent=score; fmtBest(); overS.hidden=false;
  }
  document.getElementById('startB').onclick=start;
  document.getElementById('againB').onclick=start;
  fmtBest();

  var HUES=['#f472b6','#f59e0b','#5ad1c6','#34d399','#a78bfa'];
  function spawn(now){
    var o={ x:0.12+0.76*Math.random(), y:0.12+0.76*Math.random(),
            r:0.5+Math.random()*0.5, born:now, life:1500+Math.random()*900,
            g:HUES[(Math.random()*HUES.length)|0] };
    var el=document.createElement('div'); el.className='orb'; el.style.setProperty('--g',o.g);
    orbsEl.appendChild(el); o.el=el; orbs.push(o);
  }
  function orbPx(o){ var r=stage.getBoundingClientRect(); return {cx:o.x*r.width, cy:o.y*r.height, R:Math.min(r.width,r.height)*0.09*o.r}; }

  function popAt(fx,fy){
    rx=fx;ry=fy;rt=performance.now();
    if(state!=='play') return;
    var rct=stage.getBoundingClientRect(), px=fx*rct.width, py=fy*rct.height, hit=-1, hd=1e9;
    for(var i=0;i<orbs.length;i++){ var p=orbPx(orbs[i]); var d=Math.hypot(px-p.cx,py-p.cy); if(d<p.R+22 && d<hd){hd=d;hit=i;} }
    if(hit>=0){
      var o=orbs[hit], now=performance.now();
      combo = now<comboUntil ? Math.min(combo+1,9) : 1; comboUntil=now+1400;
      var pts=10*combo; score+=pts;
      scoreEl.textContent=score; comboEl.textContent='×'+combo;
      var fx2=document.createElement('div'); fx2.className='score-fx'; fx2.textContent='+'+pts;
      fx2.style.left=(o.x*100)+'%'; fx2.style.top=(o.y*100)+'%'; fx2.style.color=o.g; orbsEl.appendChild(fx2);
      setTimeout(function(){fx2.remove();},700);
      o.el.remove(); orbs.splice(hit,1);
    } else { combo=1; comboEl.textContent='×1'; }
  }
  orbsEl.addEventListener('pointerdown',function(e){ var r=stage.getBoundingClientRect();
    popAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height); },{passive:true});

  // ---- Loop ----
  var t0=performance.now();
  function frame(now){
    resize();
    if(hasGL){ var t=(now-t0)/1000*(reduce?0.3:1), age=(now-rt)/1000;
      gl.uniform1fv(uLoc,[t,W,H,rx*W,ry*H,age,0,0]); gl.drawArrays(gl.TRIANGLES,0,3); }
    if(state==='play'){
      var left=Math.max(0,(tEnd-now)/1000); timeEl.textContent=Math.ceil(left);
      if(left<=0){ over(); }
      else{
        if(now-lastSpawn > (reduce?820:560)){ lastSpawn=now; if(orbs.length<7) spawn(now); }
        for(var i=orbs.length-1;i>=0;i--){ var o=orbs[i], a=(now-o.born)/o.life;
          if(a>=1){ o.el.remove(); orbs.splice(i,1); combo=1; comboEl.textContent='×1'; continue; }
