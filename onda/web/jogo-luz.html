<script>
(function(){
  var cv=document.getElementById('c'), gl=cv.getContext('webgl2',{antialias:false,alpha:false});
  if(!gl){ document.getElementById('ov').innerHTML='<div><h1>LUZ</h1><p>O teu navegador nao suporta WebGL2. Tenta o Safari/Chrome atualizado.</p></div>'; return; }
  var frag=document.getElementById('frag').textContent;
  var vsrc='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  function sh(ty,src){ var s=gl.createShader(ty); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s)); return s; }
  var prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,vsrc)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,frag));
  gl.bindAttribLocation(prog,0,'p'); gl.linkProgram(prog); gl.useProgram(prog);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  var uLoc=gl.getUniformLocation(prog,'u');

  var W,H,DPR;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.width=Math.round(innerWidth*DPR); H=cv.height=Math.round(innerHeight*DPR);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; gl.viewport(0,0,W,H); }
  resize(); addEventListener('resize',resize);

  // --- estado do jogo ---
  var SPD=0.45, LANES=5;
  var tx,ty,tgame,score,best,lives,combo,en,fl,running,lastN,cmax;
  best=0; try{ best=+localStorage.getItem('luz_best')||0; }catch(e){}
  var elScore=document.getElementById('score'), elHearts=document.getElementById('hearts'),
      elBest=document.getElementById('best'), elCombo=document.getElementById('combo'),
      ov=document.getElementById('ov');
  function showBest(){ elBest.textContent=best>0?('Melhor '+best):''; }
  showBest();

  function reset(){ score=0;lives=3;combo=0;cmax=0;en=0;fl=0;tgame=0;
    tx=W*0.5; ty=H*0.62; lastN=[-1,-1,-1,-1,-1]; running=true; ov.classList.add('hide');
    elScore.textContent='0'; elHearts.textContent='❤❤❤'; }

  function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  var comboTO=0;
  function flashCombo(txt){ elCombo.textContent=txt; elCombo.classList.add('on');
    clearTimeout(comboTO); comboTO=setTimeout(function(){ elCombo.classList.remove('on'); },600); }

  function gameOver(){ running=false;
    if(score>best){ best=score; try{ localStorage.setItem('luz_best',best); }catch(e){} }
    showBest();
    ov.classList.remove('hide');
    ov.innerHTML='<div><h1>LUZ</h1><p>Apanhaste</p><div class="big" style="color:#8fd0ff">'+score+'</div>'+
      '<p style="opacity:.75">'+(score>=best?'Novo recorde! ':'Melhor '+best)+'</p>'+
      '<div class="tap">Toca para jogar outra vez</div></div>'; }

  // --- entrada ---
  function at(e){ var r=cv.getBoundingClientRect(), cx=(e.clientX-r.left), cy=(e.clientY-r.top);
    tx=Math.max(0,Math.min(innerWidth,cx))*DPR; ty=Math.max(0,Math.min(innerHeight,cy))*DPR; }
  function down(e){ e.preventDefault(); at(e); if(!running) reset(); }
  function move(e){ if(e.buttons!==undefined && e.pointerType==='mouse' && e.buttons===0 && running){ /*hover move allowed*/ } at(e); }
  cv.addEventListener('pointerdown',down,{passive:false});
  addEventListener('pointermove',function(e){ at(e); },{passive:false});
  ov.addEventListener('pointerdown',function(e){ e.preventDefault(); at(e); reset(); },{passive:false});

  // --- ciclo ---
  var last=0;
  function frame(ms){ requestAnimationFrame(frame);
    var dt=last?Math.min(0.05,(ms-last)/1000):0; last=ms;
    if(running){
      tgame += dt*(1 + score*0.012);
      var catchR=0.072*H, cr2=catchR*catchR;
      for(var k=0;k<LANES;k++){
        var ph=tgame*SPD + k*0.37, n=Math.floor(ph), fr=ph-n;
        var sx=(k+0.5)/LANES*W, sy=fr*H, tp=((k*7+n*3)%5+5)%5;
        var dx=sx-tx, dy=sy-ty;
        if(dx*dx+dy*dy<cr2 && n!==lastN[k]){
          lastN[k]=n;
          if(tp===4){ lives--; combo=0; fl=1; vib(70);
            elHearts.textContent='❤❤❤'.slice(0,lives)||'';
            if(lives<=0){ gameOver(); } }
          else if(tp===3){ score+=5; combo++; fl=1; cmax=Math.max(cmax,combo); vib([0,18,40,18]); flashCombo('✦ Ouro! +5'); }
          else { score+=1; combo++; fl=Math.max(fl,0.85); cmax=Math.max(cmax,combo);
            if(combo%5===0) flashCombo('Combo '+combo); vib(8); }
          elScore.textContent=score;
        }
      }
      var tgt=Math.min(1,score/90); en += (tgt-en)*0.05;
      fl *= 0.88;
    }
    var co=Math.min(1,combo/15);
    gl.uniform1fv(uLoc,[tgame,W,H,tx,ty,en,fl,co]);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
})();
</script>
