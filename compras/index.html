<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- o dia e a noite antes do primeiro desenho (Casa → Cores; automático, como o iPhone), e a barra das horas a condizer:
     de dia branca com as horas a preto («default»); o iPhone só a lê ao abrir a app -->
<script>try { var t = localStorage.getItem('compras:tema'); if (t !== 'dia' && t !== 'noite') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'dia' : 'noite'; if (t === 'dia') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff'); } } catch (e) { /* fica a noite */ }</script>
<meta name="apple-mobile-web-app-title" content="Compras">
<meta name="description" content="A lista das compras da casa, e em que supermercado fica mais barata.">
<title>Compras</title>

</head>
