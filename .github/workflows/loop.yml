name: Loop de melhoria (autónomo)

# Corre no SERVIDOR do GitHub, fora de qualquer sessão de chat — é assim
# que os loops avançam sozinhos. A cada disparo, o Claude faz UMA volta
# (Analisar → Planear → Corrigir → Testar) de um dos focos e abre um PR.
#
# ⚙️ PRECISA (UMA SÓ VEZ): em
#    https://github.com/nelsonsous/escolaplay/settings/secrets/actions
#    → "New repository secret" → Nome: ANTHROPIC_API_KEY,
#    Valor: a tua chave (https://console.anthropic.com/settings/keys).
#    Mais nada. O robô grava num branch "claude/loop-auto" que podes
#    rever e juntar (merge) quando quiseres — não precisa de permissão
#    de PRs.

on:
  schedule:
    - cron: '17 */3 * * *'   # de 3 em 3 horas (minuto 17, fora das marcas redondas)
  workflow_dispatch:          # botão manual em Actions → Run workflow
    inputs:
      foco:
        description: 'Foco desta volta (A..F). Vazio = roda automaticamente.'
        required: false
        default: ''

concurrency:
  group: loop-melhoria        # nunca dois ao mesmo tempo → sem colisões
  cancel-in-progress: false

jobs:
  volta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Uma volta do loop
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            És o loop de melhoria do EscolaPlay. Faz UMA volta seguindo SEMPRE:
            1) ANALISAR — identifica um problema/melhoria concreto num destes focos
               (escolhe um à vez, varia entre execuções): A=English tutor B2;
               B=disciplinas (explicações em falta no Mat 5º + explicações que só
               ecoam a resposta, content.js); C=Leitura (texto+compreensão);
               D=Detetive Mental interativos; E=SRS transversal; F=Painel de Pais.
            2) PLANEAR — a alteração mínima e como validar.
            3) CORRIGIR — só essa alteração.
            4) TESTAR — node --check aos ficheiros mudados, validações específicas,
               e `npm run build`. Só avança se passar.
            Depois: bump de APP_VERSION (app.js) e CACHE_NAME (sw.js), faz
            commit com os 4 passos na mensagem e dá PUSH para o branch
            "claude/loop-auto" (cria-o se não existir; faz rebase/merge de
            origin/main antes do push para evitar conflitos). NÃO faças merge
            para main — o utilizador revê e junta quando quiser. Uma só volta
            por execução.
          claude_args: '--max-turns 40'
