<meta name="claude:viewport-fit-sides" content="cover">
<title>Onda Dash</title>
<style>
  /* Jogo arcada: mundo = campo fluido da Onda na GPU; nave + portões de neon por cima. Tema escuro deliberado. */
  :root{
    --bg:#0a0612; --panel:#180d26cc; --line:#321c48; --fg:#f6ecfb; --mut:#c3a4d9;
    --pink:#f472b6; --amber:#f59e0b; --cyan:#5ad1c6; --green:#34d399;
    color-scheme:dark;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);overflow:hidden}
  .wrap{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
    padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex:0 0 auto}
  .brand{font:800 18px/1 var(--sans);letter-spacing:-.01em;background:linear-gradient(100deg,var(--cyan),var(--pink) 60%,var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand small{display:block;font:700 9px/1.4 var(--mono);letter-spacing:.12em;color:var(--cyan);-webkit-text-fill-color:var(--cyan)}
  .hud{display:flex;gap:8px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 11px;text-align:center;min-width:62px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pill .k{font:700 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .pill .v{font:800 19px/1.1 var(--sans);margin-top:3px;font-variant-numeric:tabular-nums}
  #best .v{color:var(--amber)}
  .stage{position:relative;flex:1 1 auto;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#000;min-height:0;
    box-shadow:0 24px 70px -30px #000,0 0 44px -22px var(--pink)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fg{touch-action:none}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 35%,transparent 40%,#0a0612cc 100%)}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;padding:28px;
    background:radial-gradient(90% 70% at 50% 42%,#180d26e0,#0a0612f2);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
  .screen h1{margin:0;font:800 clamp(36px,12vw,56px)/1 var(--sans);letter-spacing:-.02em;background:linear-gradient(100deg,var(--cyan),var(--pink) 55%,var(--amber));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .screen p{margin:0;color:var(--mut);max-width:28ch;font-size:15px}
  .screen .big{font:800 58px/1 var(--sans);color:var(--fg);font-variant-numeric:tabular-nums}
  .screen .big small{display:block;font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
  button{font:800 18px var(--sans);color:#160a12;background:linear-gradient(120deg,var(--cyan),var(--pink) 70%,var(--amber));border:0;border-radius:16px;padding:14px 32px;cursor:pointer;box-shadow:0 10px 30px -10px var(--pink);-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.96)}
  .foot{flex:0 0 auto;text-align:center;color:var(--mut);font-size:11.5px;margin-top:9px}
  .foot b{color:var(--pink)}
  [hidden]{display:none!important}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">Onda&nbsp;Dash<small>GPU · Onda</small></div>
    <div class="hud">
      <div class="pill"><div class="k">Pontos</div><div class="v" id="score">0</div></div>
      <div class="pill" id="best"><div class="k">Recorde</div><div class="v" id="bestv">0</div></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
    <div class="vig"></div>
    <div class="screen" id="startS">
      <h1>Onda Dash</h1>
      <p>Arrasta o dedo para voar. Passa pelas aberturas dos portões, apanha as energias. A velocidade sobe.</p>
      <button id="startB">Jogar</button>
    </div>
    <div class="screen" id="overS" hidden>
      <div class="big"><small>Pontos</small><span id="finalScore">0</span></div>
      <p id="bestLine">Recorde: 0</p>
      <button id="againB">Outra vez</button>
    </div>
  </div>
  <div class="foot">Mundo: campo <b>Onda</b> → <code>ondac -g</code> → GLSL → GPU</div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage'), bg=document.getElementById('bg'), fg=document.getElementById('fg');
  var ctx=fg.getContext('2d');
  var scoreEl=document.getElementById('score'), bestEl=document.getElementById('bestv');
  var startS=document.getElementById('startS'), overS=document.getElementById('overS');

  // fundo: campo da Onda na GPU
  var gl=bg.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'}), uLoc=null, GW=1;
  if(gl){ var VS='#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';
    function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
    var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('frag').textContent));gl.linkProgram(pr);
    if(gl.getProgramParameter(pr,gl.LINK_STATUS)){gl.useProgram(pr);uLoc=gl.getUniformLocation(pr,'u');gl.bindVertexArray(gl.createVertexArray());}else gl=null;
  }
  if(!gl) stage.style.background='radial-gradient(circle at 50% 35%,#3a1550,#0a0612)';

  var W=1,H=1,dpr=1;
  function resize(){ var r=stage.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
    W=Math.round(r.width*dpr); H=Math.round(r.height*dpr); fg.width=W; fg.height=H;
    if(gl){ var s=Math.min(Math.max(Math.round(Math.min(r.width,r.height)*dpr),64),760); if(s!==GW){GW=s;bg.width=s;bg.height=s;gl.viewport(0,0,s,s);} } }
  resize(); window.addEventListener('resize',resize,{passive:true});

  // --- estado ---
  var state='start', score=0, best=0, dist=0, speed=0, spawnT=0, orbT=0;
  var bars=[], orbs=[], parts=[], trail=[], pops=[], px=0.5, tpx=0.5, shake=0, flash=0;
  try{ best=parseInt(localStorage.getItem('ondadash_best')||'0',10)||0; }catch(e){} bestEl.textContent=best;

  function reset(){ state='play'; score=0; dist=0; speed=0.34; spawnT=0; orbT=0; bars=[]; orbs=[]; parts=[]; trail=[]; pops=[]; px=tpx=0.5; shake=0; flash=0;
    startS.hidden=true; overS.hidden=true; scoreEl.textContent='0'; }
  function gameOver(){ state='over'; flash=1; for(var i=0;i<28;i++) burst(px,0.8,['#f472b6','#f59e0b','#5ad1c6'][i%3]);
    if(score>best){best=score;try{localStorage.setItem('ondadash_best',String(best));}catch(e){}} bestEl.textContent=best;
    document.getElementById('finalScore').textContent=score; document.getElementById('bestLine').textContent='Recorde: '+best; overS.hidden=false; }
  document.getElementById('startB').onclick=reset; document.getElementById('againB').onclick=reset;

  function burst(x,y,c){ for(var i=0;i<6;i++){ var a=Math.random()*6.28,s=0.1+Math.random()*0.5;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:c}); } }

  // input: o dedo controla o X da nave
  function setX(e){ var r=stage.getBoundingClientRect(), p=(e.touches&&e.touches[0])||e;
    tpx=Math.max(0.04,Math.min(0.96,(p.clientX-r.left)/r.width)); }
  fg.addEventListener('pointerdown',function(e){fg.setPointerCapture&&fg.setPointerCapture(e.pointerId);setX(e);},{passive:true});
  fg.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')setX(e);},{passive:true});

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0=performance.now(), last=t0, PY=0.80;

  function update(dt){
    dist+=speed*dt; speed=Math.min(0.34+dist*0.012,0.95);
    score=Math.floor(dist*10); scoreEl.textContent=score;
    px+=(tpx-px)*Math.min(1,dt*14);
    trail.push(px); if(trail.length>20) trail.shift();
    // portões
    spawnT-=dt; if(spawnT<=0){ spawnT=Math.max(0.62,1.25-dist*0.02); var gw=Math.max(0.14,0.26-dist*0.004);
      bars.push({y:-0.05, gx:0.12+Math.random()*0.76, gw:gw, done:false}); }
    for(var i=bars.length-1;i>=0;i--){ var b=bars[i], py0=b.y; b.y+=speed*dt;
      if(!b.done && py0<PY && b.y>=PY){ b.done=true; if(Math.abs(px-b.gx)>b.gw){ gameOver(); return; } else { score+=5; } }
      if(b.y>1.1) bars.splice(i,1); }
    // energias
    orbT-=dt; if(orbT<=0){ orbT=0.9+Math.random()*0.8; orbs.push({x:0.1+Math.random()*0.8,y:-0.05}); }
    for(var j=orbs.length-1;j>=0;j--){ var o=orbs[j]; o.y+=speed*dt;
      if(Math.abs(o.y-PY)<0.045 && Math.abs(o.x-px)<0.06){ score+=25; scoreEl.textContent=score; burst(o.x,o.y,'#5ad1c6'); pops.push({x:o.x,y:o.y,life:1}); orbs.splice(j,1); continue; }
      if(o.y>1.1) orbs.splice(j,1); }
    for(var k=parts.length-1;k>=0;k--){ var p=parts[k]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=dt*0.6; p.life-=dt*1.6; if(p.life<=0) parts.splice(k,1); }
    for(var m=pops.length-1;m>=0;m--){ pops[m].y-=dt*0.2; pops[m].life-=dt*1.1; if(pops[m].life<=0) pops.splice(m,1); }
    if(shake>0) shake=Math.max(0,shake-dt*3); if(flash>0) flash=Math.max(0,flash-dt*2.2);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var ox=(Math.random()-0.5)*shake*22*dpr, oy=(Math.random()-0.5)*shake*22*dpr;
    ctx.save(); ctx.translate(ox,oy);
    ctx.lineCap='round';
    // linhas de velocidade (sensação de movimento)
    if(state==='play'){ ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=2*dpr;
      for(var si=0;si<16;si++){ var lx=((si*61.803)%1)*W, ly=((dist*0.9+si*0.137)%1)*H, ll=Math.min(70,20+speed*70)*dpr;
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+ll); ctx.stroke(); } }
    // rasto da nave
    if(trail.length>1){ ctx.strokeStyle='rgba(90,209,198,0.45)'; ctx.lineWidth=5*dpr; ctx.shadowBlur=14*dpr; ctx.shadowColor='#5ad1c6';
      ctx.beginPath(); for(var ti=0;ti<trail.length;ti++){ var tX=trail[ti]*W, tY=(PY+(trail.length-1-ti)*0.013)*H; if(ti===0)ctx.moveTo(tX,tY); else ctx.lineTo(tX,tY); }
      ctx.stroke(); ctx.shadowBlur=0; }
    // portões
    for(var i=0;i<bars.length;i++){ var b=bars[i], y=b.y*H, gl1=(b.gx-b.gw)*W, gr=(b.gx+b.gw)*W;
      ctx.lineWidth=7*dpr; ctx.shadowBlur=18*dpr; ctx.shadowColor='#f472b6'; ctx.strokeStyle=b.done?'#5ad1c6':'#ff7fc4';
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(gl1,y); ctx.moveTo(gr,y); ctx.lineTo(W,y); ctx.stroke();
      ctx.shadowBlur=0; ctx.fillStyle='#ffffff'; ctx.globalAlpha=.9;
      ctx.beginPath(); ctx.arc(gl1,y,4*dpr,0,6.28); ctx.arc(gr,y,4*dpr,0,6.28); ctx.fill(); ctx.globalAlpha=1; }
    // energias
    for(var j=0;j<orbs.length;j++){ var o=orbs[j]; ctx.shadowBlur=16*dpr; ctx.shadowColor='#5ad1c6';
      var grd=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,10*dpr); grd.addColorStop(0,'#fff'); grd.addColorStop(.5,'#5ad1c6'); grd.addColorStop(1,'rgba(90,209,198,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(o.x*W,o.y*H,10*dpr,0,6.28); ctx.fill(); }
    ctx.shadowBlur=0;
    // partículas
    for(var k=0;k<parts.length;k++){ var p=parts[k]; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x*W,p.y*H,3*dpr*p.life,0,6.28); ctx.fill(); } ctx.globalAlpha=1;
    // popups de pontos
    if(pops.length){ ctx.font='800 '+(15*dpr)+'px -apple-system,system-ui,sans-serif'; ctx.textAlign='center';
      for(var pp=0;pp<pops.length;pp++){ var q=pops[pp]; ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle='#5ad1c6'; ctx.fillText('+25',q.x*W,q.y*H); }
      ctx.globalAlpha=1; ctx.textAlign='left'; }
    // nave
    if(state!=='over'){ var X=px*W, Y=PY*H, s=15*dpr;
      ctx.shadowBlur=22*dpr; ctx.shadowColor='#5ad1c6';
      var g2=ctx.createLinearGradient(X,Y-s,X,Y+s); g2.addColorStop(0,'#eafcff'); g2.addColorStop(1,'#5ad1c6');
      ctx.fillStyle=g2; ctx.beginPath(); ctx.moveTo(X,Y-s); ctx.lineTo(X+s*0.8,Y+s*0.7); ctx.lineTo(X,Y+s*0.3); ctx.lineTo(X-s*0.8,Y+s*0.7); ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; }
    ctx.restore();
    if(flash>0){ ctx.fillStyle='rgba(255,120,190,'+(flash*0.5)+')'; ctx.fillRect(0,0,W,H); }
  }

  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    resize();
    if(gl){ var t=(now-t0)/1000*(reduce?0.4:1); gl.uniform1fv(uLoc,[t,GW,GW,GW*0.5,GW*(1-(state==='play'?(dist*0.1%1):0.5)),0,0,0]); gl.drawArrays(gl.TRIANGLES,0,3); }
    if(state==='play') update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
