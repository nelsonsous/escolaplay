<title>Inglês com o Claude</title>
<!--
  Inglês com o Claude — tutor de conversação em inglês, por voz.

  App à parte da EscolaPlay, publicada como página (artifact) no claude.ai.
  - Cérebro: o Claude da conta de quem abre a página (capacidade `sample`),
    que gasta a quota do plano (Max). Não usa a API nem chaves: custo extra 0.
  - Voz do tutor: sintetizador do próprio dispositivo (speechSynthesis).
  - Voz do aluno: as páginas do claude.ai não têm acesso ao microfone, por
    isso responde-se com o ditado do teclado/sistema (ou a escrever).
  - Caderno e sessões: base de dados da própria página (`db`), só do dono;
    fora do claude.ai (ou para outras pessoas) ficam no dispositivo.
  Ver README.md nesta pasta.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
:root{
  --paper:#F1F3F8;
  --surface:#FFFFFF;
  --sunken:#E6EAF2;
  --ink:#131C33;
  --muted:#56617B;
  --faint:#838DA3;
  --line:#D3D9E5;
  --tutor:#E1E7F4;
  --marker:#FFD23F;
  --marker-hl:rgba(255,210,63,.6);
  --on-marker:#131C33;
  --red:#BF2F39;
  --red-soft:rgba(191,47,57,.09);
  --teal:#08775F;
  --teal-soft:rgba(8,119,95,.11);
  --focus:#2D64E0;
  --scrim:rgba(11,17,30,.46);
  --logo-bg:#131C33;
  --logo-fg:#FFD23F;
  --shadow:0 1px 2px rgba(19,28,51,.05),0 8px 24px rgba(19,28,51,.08);
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B111E;
    --surface:#131B2C;
    --sunken:#0F1626;
    --ink:#E5EAF4;
    --muted:#9CA6BE;
    --faint:#6E7993;
    --line:#253049;
    --tutor:#1A2541;
    --marker:#FFD23F;
    --marker-hl:rgba(255,210,63,.3);
    --on-marker:#131C33;
    --red:#FF7C82;
    --red-soft:rgba(255,124,130,.13);
    --teal:#45D4B4;
    --teal-soft:rgba(69,212,180,.13);
    --focus:#88AAFF;
    --scrim:rgba(0,0,0,.6);
    --logo-bg:#1B2746;
    --logo-fg:#FFD23F;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B111E;
  --surface:#131B2C;
  --sunken:#0F1626;
  --ink:#E5EAF4;
  --muted:#9CA6BE;
  --faint:#6E7993;
  --line:#253049;
  --tutor:#1A2541;
  --marker:#FFD23F;
  --marker-hl:rgba(255,210,63,.3);
  --on-marker:#131C33;
  --red:#FF7C82;
  --red-soft:rgba(255,124,130,.13);
  --teal:#45D4B4;
  --teal-soft:rgba(69,212,180,.13);
  --focus:#88AAFF;
  --scrim:rgba(0,0,0,.6);
  --logo-bg:#1B2746;
  --logo-fg:#FFD23F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:inline-grid;place-items:center;flex:none;line-height:0}
.ic svg{display:block}

/* ---------- estrutura ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-inline:16px}
.top{flex:none;padding-block:14px 0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--logo-bg);color:var(--logo-fg);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font:600 23px/1.1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.brand .sub{margin-top:3px;color:var(--muted);font-size:13px}
.icon-btn{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px 9px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--marker)}
.count{font-size:12px;font-variant-numeric:tabular-nums;background:var(--sunken);color:var(--muted);border-radius:999px;padding:1px 7px}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:16px 28px;-webkit-overflow-scrolling:touch}
.composer{flex:none;padding-block:10px 12px;border-top:1px solid var(--line);background:var(--paper)}

/* ---------- elementos comuns ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--marker);border-color:var(--marker);color:var(--on-marker)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.small{min-height:34px;padding:0 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip.done{color:var(--teal);border-color:var(--teal-soft);background:var(--teal-soft)}
.chip.danger{color:var(--red)}
.round{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eyebrow{display:block;font:600 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--marker-hl) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 1px}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:34px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--sunken);font-size:14px;line-height:1.45}
.notice.warn{background:var(--red-soft)}
.notice b{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- ecrã inicial ---------- */
.start{display:grid;gap:18px}
.today{display:grid;gap:10px}
.dateline{font:italic 400 17px/1.3 var(--serif);color:var(--muted)}
.level-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.level-row .lbl{font-weight:600;font-size:14px}
.level-name{color:var(--muted);font-size:13.5px}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.resume{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.resume-title{font:600 17px/1.3 var(--serif)}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.scene.open{box-shadow:var(--shadow)}
.scene-head{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px;border:0;background:none;text-align:left;color:inherit;border-radius:14px}
.slot{display:grid;justify-items:center;gap:1px;padding-right:12px;border-right:1px dashed var(--line);color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.slot b{font:500 24px/1 var(--serif);letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.scene-main{display:grid;gap:2px;min-width:0}
.scene-title{font:600 18px/1.25 var(--serif)}
.scene-who{color:var(--muted);font-size:13.5px}
.chev{color:var(--faint);transition:transform .2s}
.scene.open .chev{transform:rotate(90deg)}
.brief{display:grid;gap:14px;padding:4px 14px 16px 86px}
.brief-goal{font-size:14.5px}
.phrases{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.phrases li{display:flex;align-items:center;gap:10px;font:400 17px/1.35 var(--serif)}
.phrases .pt{display:block;font:400 13px/1.3 var(--sans);color:var(--muted)}
.voice-note{font-size:13px;color:var(--muted);max-width:60ch}
.howto{border-top:1px solid var(--line);padding-top:14px}
.howto summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px;max-width:65ch}

/* ---------- conversa ---------- */
.scene-bar{position:sticky;top:-16px;z-index:2;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:-16px 0 14px;padding:12px 0;background:var(--paper);border-bottom:1px solid var(--line)}
.scene-bar .t{font:600 17px/1.2 var(--serif)}
.scene-bar .s{font-size:12.5px;color:var(--muted)}
.transcript{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:88%}
.msg.tutor{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.bubble{padding:11px 14px;border-radius:16px;overflow-wrap:anywhere}
.tutor .bubble{background:var(--tutor);font:400 18.5px/1.45 var(--serif);border-top-left-radius:5px}
.me .bubble{background:var(--surface);border:1px solid var(--line);border-top-right-radius:5px;font-size:15.5px}
.msg-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bars{display:none;align-items:flex-end;gap:2px;height:14px;margin-left:2px}
.speaking .bars{display:inline-flex}
.voice-pending .bars{display:inline-flex;opacity:.35}
.voice-pending .bars i{animation-duration:1.6s}
.bars i{width:3px;height:100%;background:var(--teal);border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}.bars i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.dots{display:inline-flex;gap:4px;align-items:center;min-height:26px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fix{display:grid;gap:5px;max-width:100%;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.fix-label{font:600 11px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.fix-line{font:400 17.5px/1.5 var(--serif)}
.fix-said{font-size:13.5px;color:var(--muted)}
.fix-why{font-size:13.5px;color:var(--muted)}
del{color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-thickness:1.5px;border-radius:3px;padding:0 2px}
ins{color:var(--teal);background:var(--teal-soft);text-decoration:none;border-radius:3px;padding:0 2px;font-weight:600}
.inline-err{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;border:1px dashed var(--red);background:var(--red-soft);font-size:14px}
.report{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.report h3{margin:0;font:600 21px/1.25 var(--serif);text-wrap:balance}
.report h4{margin:4px 0 0;font:600 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.report ul{margin:0;padding-left:18px;display:grid;gap:4px}
.report .fix{box-shadow:none}
.report .phrases li{font-size:17px}
.saved-note{font-size:13.5px;color:var(--teal);font-weight:600}
.end-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:4px}

/* ---------- compositor ---------- */
.quick{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.form{display:flex;gap:8px;align-items:flex-end}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.mic[aria-expanded="true"]{background:var(--marker);border-color:var(--marker);color:var(--on-marker)}
.form textarea{flex:1;min-width:0;min-height:44px;max-height:160px;resize:none;border:1px solid var(--line);border-radius:22px;padding:10px 16px;background:var(--surface);font-size:16px;line-height:1.4}
.form textarea::placeholder{color:var(--faint)}
.send{flex:none;height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--ink);color:var(--paper);font-weight:600}
.send:disabled{opacity:.45;cursor:not-allowed}
.dictate-tip{margin-top:8px;font-size:13px;color:var(--muted);max-width:65ch}
.hints{display:grid;gap:10px;margin-bottom:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-height:38vh;overflow-y:auto}
.hints-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.hint-en{font:400 17px/1.35 var(--serif)}
.hint-pt{font-size:13px;color:var(--muted)}
.hint .row{grid-row:1 / span 2;grid-column:2}

/* ---------- caderno e sessões ---------- */
.list-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:6px}
.list-head h2{margin:0;font:600 22px/1.2 var(--serif)}
.notes{list-style:none;margin:0;padding:0}
.note{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.note-en{font:400 18.5px/1.35 var(--serif)}
.note-pt{font-size:14px;color:var(--muted)}
.note-meta{font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.note-tools{grid-column:2;grid-row:1 / span 3;display:flex;gap:6px;align-items:flex-start}
.tag{display:inline-block;font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.tag.fix-tag{color:var(--red);background:var(--red-soft)}
.tag.ex{color:var(--on-marker);background:var(--marker)}
.panel{display:grid;gap:10px;margin-top:20px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.panel summary{cursor:pointer;font-weight:600}
.panel input[type="text"],.panel textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper);font-size:16px}
.panel textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sess{display:grid;grid-template-columns:62px 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.sess-date{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.sess-date b{display:block;font:500 17px/1.2 var(--serif);color:var(--ink)}
.sess-title{font:600 17px/1.3 var(--serif)}
.sess-head{font-size:14px;color:var(--muted)}
.sess .row{margin-top:6px}
.sess-body{grid-column:1 / -1;display:grid;gap:12px;margin-top:8px}
.transcript-mini{display:grid;gap:6px;font-size:14px;padding:12px;border-radius:12px;background:var(--sunken)}
.transcript-mini b{font-weight:600}
.empty{display:grid;gap:10px;padding:18px 0;color:var(--muted);max-width:60ch}

/* ---------- definições ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:18px;padding:0 18px 18px;box-shadow:var(--shadow)}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:600 21px/1.2 var(--serif)}
.sheet-head .icon-btn{margin-left:0}
.field{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.field>.lbl{font-weight:600;font-size:14px}
.field .hint-txt{font-size:13px;color:var(--muted);max-width:60ch}
.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--paper);font-size:15px}
.range{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.range input{flex:1;min-width:140px;accent-color:var(--ink)}
.range output{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.5em}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer}
.switch span{display:grid;gap:2px}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;margin:0;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--teal)}
.switch input:checked::after{transform:translateX(18px)}
.choice{display:grid;gap:8px}
.choice label{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.choice input{margin:3px 0 0;accent-color:var(--ink);grid-row:1 / span 2}
.choice small{color:var(--muted);font-size:13px}
.about{display:grid;gap:8px;padding-top:14px;font-size:13.5px;color:var(--muted)}
.status-line{font-size:13.5px;padding:9px 12px;border-radius:10px;background:var(--sunken);color:var(--ink)}
.status-line.good{background:var(--teal-soft);color:var(--teal);font-weight:600}
.status-line.bad{background:var(--red-soft)}
.setup summary{cursor:pointer;font-weight:600;font-size:14px}
.setup ol{margin:10px 0 0;padding-left:20px;display:grid;gap:10px;font-size:13.5px;max-width:62ch}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--sunken);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.cmd{display:block;margin-top:6px;padding:8px 10px;white-space:pre-wrap;line-height:1.6}

@media (max-width:480px){
  .brand h1{font-size:21px}
  .scene-head{grid-template-columns:48px 1fr auto;gap:12px;padding:12px}

<script>
(() => {
'use strict';
document.documentElement.lang = 'pt-PT';

/* ================================================================

const $ = (sel, root = document) => root.querySelector(sel);

}
const ICONS = {

function icon(name) { const s = document.createElement('span'); s.className = 'ic'; s.innerHTML = ICONS[name] || ''; return s; }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v)).trim();
const normKey = s => str(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[^\p{L}\p{N}' ]+/gu, ' ').replace(/\s+/g, ' ').trim();
const isTouch = matchMedia('(pointer: coarse)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem('icc:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('icc:' + k, JSON.stringify(v)); } catch {} },

function toast(msg) {
  let t = $('#toast');
  if (!t) { t = h('div', { id: 'toast', class: 'toast', role: 'status' }); document.body.append(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
function copyText(text) {
  try {
    const p = navigator.clipboard && navigator.clipboard.writeText(text);
    if (p && p.then) { p.then(() => toast('Copiado'), () => toast('Não deu para copiar — seleciona o texto à mão')); return; }
  } catch {}
  toast('Não deu para copiar — seleciona o texto à mão');
}

/* ================================================================
   Conteúdo: níveis e cenas
   ================================================================ */
const LEVELS = {
  A2: { name: 'Elementar', rate: 0.85, guide: 'Use very simple, short sentences and everyday words, and speak slowly and clearly. Only correct mistakes that make the meaning unclear.' },
  B1: { name: 'Intermédio', rate: 0.92, guide: 'Use clear, simple professional English and short sentences. Avoid idioms unless you explain them. Correct the most important mistake.' },
  B2: { name: 'Intermédio alto', rate: 1, guide: 'Use natural professional English, including common idioms and phrasal verbs. Correct grammar and unnatural phrasing.' },
  C1: { name: 'Avançado', rate: 1.05, guide: 'Use rich, idiomatic English at natural speed. Point out subtle issues too: register, collocations, tone and nuance.' },
};

const SCENES = [
  { id: 'free', mins: 5, title: 'Conversa livre', titleEn: 'Free conversation',
    who: 'Alex · colega do escritório de Londres',
    goal: 'Falar uns minutos sobre o teu dia, o fim de semana ou o que quiseres, sem deixar a conversa morrer.',
    role: 'Alex, a friendly and curious colleague from the London office who enjoys a relaxed chat about work, travel, food and weekend plans',
    aim: 'keep a relaxed conversation going for a few minutes about everyday topics',
    phrases: ['To be honest, …', 'What I mean is …', 'That reminds me of …', 'Anyway, …'] },
  { id: 'standup', mins: 5, title: 'Daily stand-up', titleEn: 'Daily stand-up meeting',
    who: 'Sophie · delivery lead do rollout S/4HANA',

    goal: 'Dizer que não com diplomacia, explicar o impacto e propor alternativas (change request, fase 2).',
    role: "Laura, the client's finance director: warm but persistent; she wants a new custom report added before go-live without moving the date or the budget",
    aim: 'push back politely on out-of-scope work, explain the impact and offer options such as a change request or a phase 2',
    phrases: ["I see where you're coming from, but …", 'That would have an impact on …', 'One option would be to …', "Let's raise a change request so we can assess it properly."] },
  { id: 'delay', mins: 8, title: 'Anunciar um atraso', titleEn: 'Announcing a delay',

    role: 'Priya, a key user from accounts payable in a fit-to-standard workshop: helpful but used to the old system, she keeps asking for custom fields and extra approval steps',
    aim: 'lead the workshop through the standard SAP process, capture real gaps and steer away from unnecessary customisation',
    phrases: ["Let's walk through the standard process first.", 'Could you give me an example?', 'Is this a must-have or a nice-to-have?', "Let's park that and come back to it."] },
  { id: 'coffee', mins: 5, title: 'Café antes da reunião', titleEn: 'Small talk before a meeting',
    who: 'Tom · consultor britânico de visita a Lisboa',
    goal: 'Conversa de circunstância — viagem, tempo, comida, planos — e depois entrar na reunião.',

    role: 'Emma, a hiring manager at an international consultancy interviewing for a Senior SAP Project Manager role: professional and friendly, she asks behavioural questions ("tell me about a time when…")',
    aim: 'present their experience clearly, tell a structured story about a difficult project and explain how they manage stakeholders',
    phrases: ["I've been working as … for … years.", 'One of the toughest projects I led was …', 'What I learned from that was …', "I'd describe my style as …"] },
];

const REVIEW_META = {
  id: 'review', mins: 5, title: 'Rever o meu caderno', titleEn: 'Review of the learner’s own phrasebook',
  who: 'Claude · o teu tutor',
  goal: 'Usar as frases do teu caderno em mini-situações do dia de trabalho, uma de cada vez.',
  role: "Claude, a friendly English coach who sets up quick, realistic mini-situations from a project manager's working day",
  aim: 'use each target expression correctly in a realistic sentence',
  review: true,
};

/* ================================================================
   Definições (por dispositivo — as vozes mudam de aparelho para aparelho)
   ================================================================ */
const DEFAULTS = { level: 'B1', accent: 'en-GB', engine: 'mistral', mistralVoice: '', voiceURI: '', rate: 1, autoSpeak: true, ptHelp: true, autoSend: false, tier: 'quick' };
const settings = Object.assign({}, DEFAULTS, store.get('settings', {}));
if (!LEVELS[settings.level]) settings.level = DEFAULTS.level;
if (!['quick', 'default'].includes(settings.tier)) settings.tier = DEFAULTS.tier;
if (!['mistral', 'device'].includes(settings.engine)) settings.engine = DEFAULTS.engine;
if (!/^[A-Za-z0-9_.-]{0,64}$/.test(String(settings.mistralVoice || ''))) settings.mistralVoice = '';
const saveSettings = () => store.set('settings', settings);

/* ================================================================
   Claude (capacidades do claude.ai)
   ================================================================ */
const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
let sampleFn = null;
let sampleResolved = false;
const samplePromise = (hasClaude ? window.claude.use('sample').catch(() => null) : Promise.resolve(null))
  .then(s => { sampleFn = s; sampleResolved = true; renderStartIfVisible(); return s; });

const ERR = {
  no_claude: 'O tutor só responde dentro do claude.ai, com a tua sessão iniciada. Abre a app a partir do teu claude.ai.',
  not_granted: 'Esta página não tem autorização para usar o Claude. Recarrega-a e aceita o pedido de acesso para praticar.',
  sampling_disabled: 'O Claude não está disponível para esta conta.',
  not_declared: 'Esta versão da app já não pode usar o Claude. Recarrega a página.',
  capability_disabled: 'O Claude não está disponível nesta vista. Abre a app no claude.ai, no browser ou na app Claude.',
  capability_removed: 'Esta vista é antiga demais para a app. Atualiza a app Claude ou abre no browser.',
  rate_limited: 'Chegaste ao limite de utilização do teu plano Claude por agora. Espera um pouco e tenta de novo.',
  session_expired: 'A tua sessão no claude.ai terminou. Inicia sessão outra vez e volta aqui.',
  refused: 'O Claude não respondeu a esta mensagem. Tenta dizê-la de outra forma.',
  empty_completion: 'O Claude não devolveu resposta. Tenta outra vez com uma frase mais curta.',
  invalid_json: 'A resposta veio num formato inesperado. Tenta outra vez.',
  prompt_too_large: 'A conversa ficou longa demais. Termina esta sessão e começa outra.',
  cancelled: 'Resposta cancelada.',
  upstream_error: 'A ligação ao Claude falhou. Tenta outra vez.',
};
const FATAL = new Set(['no_claude', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed']);
const errCode = e => (e && typeof e.code === 'string' ? e.code : 'upstream_error');
const errText = e => ERR[errCode(e)] || ERR.upstream_error;
async function getSample() {
  const s = await samplePromise;
  if (!s) throw { code: hasClaude ? 'capability_disabled' : 'no_claude' };
  return s;
}

/* ================================================================
   Prompts
   ================================================================ */
const OPENING = 'Start now: open the scene in your role with a short, natural greeting and your first question. "fix" must be null.';

function convoRules(scene, level) {
  const L = LEVELS[level] || LEVELS.B1;
  const why = settings.ptHelp
    ? 'a short reason in European Portuguese (Portugal, never Brazilian Portuguese), at most 15 words'
    : 'a short reason in simple English, at most 15 words';
  const lines = [
    'You are Claude, working as a spoken-English coach through a role-play.',
    'The learner is Portuguese (from Portugal) and works as an SAP project manager: S/4HANA rollouts, cut-overs, steering committees, international clients.',
    'This is a voice conversation. Your "say" text is read aloud by a text-to-speech voice, and the learner answers by voice dictation, so ignore missing punctuation, capital letters and obvious dictation slips such as wrong homophones.',
    '',
    'Scene: ' + scene.titleEn,
    'Your role: ' + scene.role,
    'The learner wants to: ' + scene.aim,
    'Expressions to encourage (weave them in naturally, never force them): ' + scene.phrases.join(' | '),
    'Learner level: ' + level + ' (CEFR). ' + L.guide,
  ];
  if (scene.review) {
    lines.push('This is a review session. Work through the target expressions one at a time: set up a short, realistic situation from a project manager\'s day where the expression fits, ask the learner to respond, react briefly, then move on to the next one. If they do not use the expression, show it in "fix" as the better version.');
  }
  lines.push(
    '',
    'For every reply:',
    '- "say": stay in your role and keep the scene moving. One to three short spoken sentences, then one clear question or prompt for the learner. Plain spoken English only: no lists, no markdown, no emoji, no stage directions, no translations.',
    '- "fix": look only at the learner\'s last message. If it contains a mistake that matters (grammar, wrong word, unnatural or Portuguese-sounding phrasing), return {"you": the words they used, "better": the natural way to say it, "why": ' + why + '}. Pick only the single most useful correction. If the message is fine, "fix" is null.',
    '- If the learner writes in Portuguese or asks how to say something, reply in role in English and use "fix" to give them the English version ("why": ' + (settings.ptHelp ? '"Em inglês diz-se assim."' : '"This is how you say it in English."') + ').',
    '- If the learner drifts off topic, follow briefly, then steer back to the scene. If they want to stop, close the scene warmly in role.',
    '',
    'Reply with only one JSON object and nothing else, in this shape:',
    '{"say": "...", "fix": null}',
    'or',
    '{"say": "...", "fix": {"you": "...", "better": "...", "why": "..."}}'
  );
  return lines.join('\n');
}

const MAX_CONTEXT_TURNS = 30;
function buildTurns(sess, opening) {
  const out = [{ role: 'user', content: convoRules(sess.scene, sess.level) + (opening ? '\n\n' + OPENING : '') }];
  const all = sess.turns;
  const from = Math.max(0, all.length - MAX_CONTEXT_TURNS);
  for (let i = from; i < all.length; i++) {
    const t = all[i];
    if (t.r === 't') {
      const prev = all[i - 1];
      const fix = prev && prev.r === 'm' && prev.f ? prev.f : null;
      out.push({ role: 'assistant', content: JSON.stringify({ say: t.x, fix }) });
    } else {
      out.push({ role: 'user', content: t.x });
    }
  }
  return out;
}

function hintPrompt(sess, lastSay) {
  const s = sess.scene;
  return [
    'A Portuguese learner of English (CEFR ' + sess.level + '), who works as an SAP project manager, is stuck in a spoken role-play and needs ideas for what to say next.',
    'Scene: ' + s.titleEn + '. They want to: ' + s.aim + '.',
    'The other person just said: "' + lastSay + '"',
    'Suggest 3 different, natural replies they could say out loud next, at most 22 words each, at their level. Where it fits, use expressions like: ' + s.phrases.join(' | ') + '.',
    'Reply with only JSON: {"options": [{"en": "...", "pt": "tradução em português de Portugal"}]}',
  ].join('\n');
}

function reportPrompt(sess) {
  const s = sess.scene;
  const lines = sess.turns.map(t => (t.r === 't' ? 'COACH: ' : 'LEARNER: ') + t.x);
  let transcript = lines.join('\n');
  if (transcript.length > 40000) transcript = transcript.slice(-40000);
  const shown = sess.turns.filter(t => t.r === 'm' && t.f).map(t => '- ' + t.f.you + ' -> ' + t.f.better).join('\n');
  return [
    'You are an English speaking coach. Below is the transcript of a spoken role-play practice. The learner used voice dictation, so ignore punctuation, capitalisation and obvious dictation slips.',
    'Learner: Portuguese SAP project manager, CEFR ' + sess.level + '. Scene: ' + s.titleEn + '. Goal: ' + s.aim + '.',
    '',
    'Transcript:',
    transcript,
    '',
    shown ? 'Corrections already shown during the session:\n' + shown + '\n' : '',
    'Write the feedback in European Portuguese (Portugal, never Brazilian Portuguese); English examples stay in English.',
    'Give 3 to 5 fixes (the most useful across the whole session; prefer repeated patterns) and 5 phrases at their level that fit this scene and that they did not use.',
    'Reply with only this JSON:',
    '{"headline": "one sentence on how it went", "went_well": ["2 or 3 specific things they did well"], "fixes": [{"you": "their words", "better": "natural English", "why": "reason, max 15 words"}], "phrases": [{"en": "useful expression", "pt": "tradução"}], "focus": "one thing to practise next time, max 25 words"}',
  ].join('\n');
}

function voicePrompt(scene, level) {
  const L = LEVELS[level] || LEVELS.B1;
  return [

/* ================================================================
   Diferenças palavra a palavra (o que disseste vs. a versão melhor)
   ================================================================ */
const wordKey = w => w.toLowerCase().replace(/[’‘`]/g, "'").replace(/[^\p{L}\p{N}']/gu, '');

    }
  }
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (KA[i] === KB[j]) { ops.push(['=', B[j]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(['-', A[i]]); i++; }
    else { ops.push(['+', B[j]]); j++; }
  }
  while (i < n) ops.push(['-', A[i++]]);

    if (str(you)) frag.append(h('span', { class: 'fix-said' }, 'Disseste: ', h('del', { lang: 'en' }, you)));
    return frag;
  }
  const line = h('span', { class: 'fix-line', lang: 'en' });

    if (dels.length) line.append(h('del', null, dels.join(' ')), ' ');
    if (adds.length) line.append(h('ins', null, adds.join(' ')), ' ');

/* ================================================================

const data = {
  db: null,

    const maybeMigrate = () => { if (gotNotes && gotSessions) this.migrate(localNotes, localSessions); };

        dataChanged();

    for (const n of notes) {
      if (haveN.has(normKey(n.en))) continue;
      try { const { id, ...body } = n; await this.db.doc('notebook/' + (id || uid())).set(body); } catch (e) { this.fail(e); return; }

      seen.add(k);
      fresh.push({
        id: uid(), en, pt: str(it.pt).slice(0, 400), you: str(it.you).slice(0, 400), why: str(it.why).slice(0, 300),
        kind: it.kind === 'fix' ? 'fix' : 'phrase', scene: str(it.scene).slice(0, 80), createdAt: Date.now() + fresh.length,
      });
    }
    if (!fresh.length) return 0;
    if (this.db) {
      for (const n of fresh) {
        const { id, ...body } = n;
        try { await this.db.doc('notebook/' + id).set(body); }
        catch (e) { this.fail(e); if (!this.db) return this.addNotes(fresh); throw e; }
      }
    } else {
      this.notebook = fresh.slice().reverse().concat(this.notebook);
      this.saveLocal();
      dataChanged();
    }
    return fresh.length;
  },
  async removeNote(id) {
    if (this.db) {
      try { await this.db.doc('notebook/' + id).delete(); } catch (e) { this.fail(e); }
    } else {
      this.notebook = this.notebook.filter(n => n.id !== id);
      this.saveLocal();
      dataChanged();
    }
  },
  sessionBody(s) {
    return {
      scene: s.scene, level: s.level, startedAt: s.startedAt, updatedAt: s.updatedAt,
      ended: !!s.ended, report: s.report || null, turns: s.turns.slice(-120),
    };
  },
  saveSession(s) {
    const body = this.sessionBody(s);
    if (this.db) {
      const db = this.db;
      const prev = this.queue.get(s.id) || Promise.resolve();
      const next = prev.then(() => db.doc('sessions/' + s.id).set(body)).catch(e => this.fail(e));
      this.queue.set(s.id, next);
      next.then(() => { if (this.queue.get(s.id) === next) this.queue.delete(s.id); this.prune(); });
    } else {
      this.sessions = [Object.assign({}, body, { id: s.id })].concat(this.sessions.filter(x => x.id !== s.id))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 40);
      this.saveLocal();
      dataChanged();
    }
  },
  async prune() {
    if (!this.db || this.sessions.length <= MAX_SESSIONS) return;
    const old = this.sessions.slice(MAX_SESSIONS);
    for (const s of old) { try { await this.db.doc('sessions/' + s.id).delete(); } catch { return; } }
  },
  async removeSession(id) {
    if (this.db) {
      try { await this.db.doc('sessions/' + id).delete(); } catch (e) { this.fail(e); }
    } else {
      this.sessions = this.sessions.filter(s => s.id !== id);
      this.saveLocal();
      dataChanged();
    }
  },
};

const fmtShort = new Intl.DateTimeFormat('pt-PT', { day: 'numeric', month: 'short' });
const fmtTime = new Intl.DateTimeFormat('pt-PT', { hour: '2-digit', minute: '2-digit' });
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'agora mesmo';
  if (m < 60) return 'há ' + m + ' min';
  const hr = Math.round(m / 60);
  if (hr < 24) return 'há ' + hr + ' h';
  if (hr < 48) return 'ontem';
  return fmtShort.format(new Date(t));
}
const learnerCount = s => (s && Array.isArray(s.turns) ? s.turns.filter(t => t.r === 'm').length : 0);
function streak() {
  const days = new Set(data.sessions.filter(s => learnerCount(s) >= 2).map(s => dayKey(s.startedAt)));
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function normalizeReply(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
  const say = str(o.say || o.reply || o.text).replace(/[*_#`]/g, '').replace(/\s+/g, ' ').trim();
  if (!say) return null;
  let fix = null;
  const f = o.fix;
  if (f && typeof f === 'object' && str(f.better)) {
    fix = { you: str(f.you).slice(0, 500), better: str(f.better).slice(0, 500), why: str(f.why).slice(0, 300) };
    if (normKey(fix.you) === normKey(fix.better)) fix = null;
  }
  return { say, fix };
}
// Se o JSON vier estragado, aproveita pelo menos a fala.
function salvage(raw) {
  raw = str(raw);
  if (!raw) return null;
  const m = raw.match(/"say"\s*:\s*"((?:[^"\\]|\\.)*)"/);
  if (m) { try { return normalizeReply({ say: JSON.parse('"' + m[1] + '"') }); } catch {} }
  if (!/[{}]/.test(raw)) return normalizeReply({ say: raw });
  return null;
}

}

async function askTutor(opening) {
  const sess = S.session;
  if (!sess || S.busy || sess.ended) return;
  clearInlineError();
  S.busy = true;
  updateComposer();
  const typing = typingNode();
  E.transcript.append(typing);
  scrollBottom(true);
  const ctl = new AbortController();
  S.ctl = ctl;
  let reply = null, err = null;
  try {
    const sample = await getSample();
    const out = await sample.json(buildTurns(sess, opening), { modelTier: settings.tier, cache: false, signal: ctl.signal });
    reply = normalizeReply(out);
    if (!reply) err = { code: 'invalid_json' };
  } catch (e) {
    if (errCode(e) === 'invalid_json') reply = salvage(e && e.text);
    if (!reply) err = e;
  } finally {
    typing.remove();
    S.busy = false;
    if (S.ctl === ctl) S.ctl = null;
  }
  if (S.session !== sess) return;
  if (reply) {
    const last = sess.turns[sess.turns.length - 1];
    if (!opening && last && last.r === 'm' && reply.fix) {
      last.f = reply.fix;
      const node = E.transcript.querySelector('.msg[data-i="' + (sess.turns.length - 1) + '"]');
      if (node) node.append(fixNode(reply.fix, sess.scene.title));
    }
    sess.turns.push({ r: 't', x: reply.say });
    const idx = sess.turns.length - 1;
    E.transcript.append(turnNode(sess.turns[idx], idx));
    persist();
    scrollBottom(true);
    if (settings.autoSpeak && S.view === 'practice' && S.mode === 'convo' && document.visibilityState === 'visible') speakTurn(idx);
    if (!isTouch && S.mode === 'convo') E.input.focus({ preventScroll: true });
  } else {
    showInlineError(err, () => askTutor(opening));
  }
  updateComposer();
}

function sendLearner(text) {
  text = str(text);
  const sess = S.session;
  if (!text || !sess || S.busy || sess.ended || S.blocked) return;
  tts.stop();
  tts.unlock();
  hideHints();
  clearInlineError();
  sess.turns.push({ r: 'm', x: text.slice(0, 2000) });
  const idx = sess.turns.length - 1;
  E.transcript.append(turnNode(sess.turns[idx], idx));
  E.input.value = '';
  autosize();
  persist();
  scrollBottom(true);
  askTutor(false);
}

async function endSession() {
  const sess = S.session;
  if (!sess || sess.ended) return;
  tts.stop();
  if (S.ctl) S.ctl.abort();
  hideHints();
  clearInlineError();
  sess.ended = true;
  persist();
  renderSceneBar();
  updateComposer();
  wakeOff();
  if (learnerCount(sess) >= 2) {
    const mount = h('div');
    E.transcript.append(mount);
    scrollBottom(true);
    await runReport(sess, mount);
  } else {
    E.transcript.append(h('p', { class: 'notice' }, 'Conversa terminada. Com pelo menos duas respostas tuas, o Claude faz uma avaliação no fim.'));
  }
  if (S.session === sess) { E.transcript.append(endActions(sess)); scrollBottom(true); }
}

function endActions(sess) {
  const scene = sess.scene;
  return h('div', { class: 'end-actions' },
    h('button', { class: 'btn dark', type: 'button', onclick: () => { closeSession(); leaveConvo(); } }, 'Voltar à agenda'),
    scene.review ? null : h('button', { class: 'btn', type: 'button', onclick: () => { const sc = SCENES.find(x => x.id === scene.id); if (sc) startSession(sc); } }, 'Repetir esta cena'));
}

function normalizeReport(o) {
  if (!o || typeof o !== 'object') return null;
  const arr = v => (Array.isArray(v) ? v : []);
  const rep = {
    headline: str(o.headline),
    went_well: arr(o.went_well).map(str).filter(Boolean).slice(0, 4),
    fixes: arr(o.fixes).map(f => ({ you: str(f && f.you), better: str(f && f.better), why: str(f && f.why) })).filter(f => f.better).slice(0, 6),
    phrases: arr(o.phrases).map(p => ({ en: str(p && p.en), pt: str(p && p.pt) })).filter(p => p.en).slice(0, 6),
    focus: str(o.focus),
  };
  return rep.headline || rep.fixes.length || rep.phrases.length ? rep : null;
}

async function runReport(sess, mount) {
  const ctl = new AbortController();
  const pending = h('div', { class: 'report' },
    h('span', { class: 'eyebrow' }, 'Avaliação da sessão'),
    h('p', null, h('span', { class: 'dots' }, h('i'), h('i'), h('i')), ' O Claude está a rever a conversa. Pode demorar até um minuto.'),
    h('div', null, h('button', { class: 'btn small', type: 'button', onclick: () => ctl.abort() }, 'Cancelar')));
  mount.textContent = '';
  mount.append(pending);
  try {
    const sample = await getSample();
    const out = await sample.json(reportPrompt(sess), { modelTier: 'default', signal: ctl.signal });
    const rep = normalizeReport(out);
    if (!rep) throw { code: 'invalid_json' };
    sess.report = rep;
    if (S.session === sess) persist(); else data.saveSession(sess);
    let saved = 0;
    try {
      saved = await data.addNotes([
        ...rep.fixes.map(f => ({ kind: 'fix', en: f.better, you: f.you, why: f.why, scene: sess.scene.title })),
        ...rep.phrases.map(p => ({ kind: 'phrase', en: p.en, pt: p.pt, scene: sess.scene.title })),
      ]);
    } catch { saved = -1; }
    mount.textContent = '';
    mount.append(reportNode(rep, sess, saved));
    return true;
  } catch (e) {
    mount.textContent = '';
    mount.append(h('div', { class: 'inline-err', role: 'alert' },
      h('span', null, errCode(e) === 'cancelled' ? 'Avaliação cancelada.' : errText(e)),
      FATAL.has(errCode(e)) ? null : h('button', { class: 'btn small', type: 'button', onclick: () => runReport(sess, mount) }, 'Avaliar agora')));
    return false;
  }
}

function reportNode(rep, sess, saved) {
  const box = h('section', { class: 'report', 'aria-label': 'Avaliação da sessão' },
    h('span', { class: 'eyebrow' }, 'Avaliação da sessão'),
    h('h3', null, rep.headline || 'Sessão terminada'));
  if (rep.went_well.length) box.append(h('h4', null, 'Correu bem'), h('ul', null, rep.went_well.map(x => h('li', null, x))));
  if (rep.fixes.length) box.append(h('h4', null, 'A corrigir'), rep.fixes.map(f => fixNode(f, sess.scene.title)));
  if (rep.phrases.length) {
    box.append(h('h4', null, 'Frases para a próxima'), h('ul', { class: 'phrases' }, rep.phrases.map(p => h('li', null,
      h('button', { class: 'round', type: 'button', 'aria-label': 'Ouvir: ' + p.en, onclick: () => sayPhrase(p.en) }, icon('play')),
      h('span', { lang: 'en' }, h('span', { class: 'hl' }, p.en), p.pt ? h('span', { class: 'pt', lang: 'pt-PT' }, p.pt) : null)))));
  }
  if (rep.focus) box.append(h('h4', null, 'Foco para a próxima vez'), h('p', null, rep.focus));
  if (saved != null) {
    box.append(h('p', { class: 'saved-note' }, saved > 0 ? 'Guardei ' + plural(saved, 'frase nova', 'frases novas') + ' no teu caderno.'
      : saved === 0 ? 'Estas frases já estavam no teu caderno.' : 'Não consegui guardar as frases no caderno.'));
  }
  return box;
}

/* ---------- ideias para responder ---------- */
function hideHints() {
  if (S.hintCtl) { S.hintCtl.abort(); S.hintCtl = null; }
  E.hints.hidden = true;
  E.hints.textContent = '';
}
async function showHints() {
  const sess = S.session;
  if (!sess || sess.ended) return;
  const li = lastTutorIndex(sess);
  if (li < 0) return;
  if (!E.hints.hidden) { hideHints(); return; }
  const ctl = new AbortController();
  S.hintCtl = ctl;
  const head = h('div', { class: 'hints-head' }, h('span', { class: 'eyebrow' }, 'Ideias para responder'),
    h('button', { class: 'round', type: 'button', 'aria-label': 'Fechar ideias', onclick: hideHints }, icon('close')));
  E.hints.textContent = '';
  E.hints.append(head, h('p', { class: 'muted' }, h('span', { class: 'dots' }, h('i'), h('i'), h('i'))));
  E.hints.hidden = false;
  try {
    const sample = await getSample();
    const out = await sample.json(hintPrompt(sess, sess.turns[li].x), { modelTier: 'quick', signal: ctl.signal });
    const opts = (out && Array.isArray(out.options) ? out.options : []).map(o => ({ en: str(o && o.en), pt: str(o && o.pt) })).filter(o => o.en).slice(0, 3);
    if (!opts.length) throw { code: 'invalid_json' };
    if (S.hintCtl !== ctl) return;
    E.hints.textContent = '';
    E.hints.append(head);
    for (const o of opts) {
      E.hints.append(h('div', { class: 'hint' },
        h('span', { class: 'hint-en', lang: 'en' }, o.en),
        o.pt ? h('span', { class: 'hint-pt' }, o.pt) : h('span'),
        h('div', { class: 'row' },
          h('button', { class: 'round', type: 'button', 'aria-label': 'Ouvir: ' + o.en, onclick: () => sayPhrase(o.en) }, icon('play')),
          h('button', { class: 'chip', type: 'button', onclick: () => { E.input.value = o.en; autosize(); hideHints(); E.input.focus(); } }, 'Usar'))));
    }
    E.hints.append(h('p', { class: 'hint-pt' }, 'Dica: ouve, repete em voz alta e só depois dita a tua versão.'));
  } catch (e) {
    if (S.hintCtl !== ctl || errCode(e) === 'cancelled') return;
    E.hints.textContent = '';
    E.hints.append(head, h('p', { class: 'muted' }, errText(e)));
  } finally {
    if (S.hintCtl === ctl) S.hintCtl = null;

/* ---------- compositor ---------- */
function updateComposer() {
  const s = S.session;
  const show = S.view === 'practice' && S.mode === 'convo' && !!s && !s.ended;
  E.composer.hidden = !show;
  if (!show) return;
  const hasTutor = lastTutorIndex(s) >= 0;
  E.send.disabled = S.busy || !!S.blocked;
  E.qRepeat.disabled = !hasTutor;
  E.qSlow.disabled = !hasTutor;
  E.qHint.disabled = !hasTutor || !!S.blocked;

function autosize() {

}
function dictationTip() {
  const ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'No iPhone/iPad: toca no microfone do teclado e fala. Para ditar em inglês, muda para o teclado English com a tecla do globo.';
  if (/Android/i.test(ua)) return 'No Android: toca no microfone do teclado (Gboard) e fala. Junta English às línguas de ditado do Gboard.';
  if (/Macintosh|Mac OS/i.test(ua)) return 'No Mac: carrega duas vezes na tecla do microfone (ou Fn) e fala. A língua do ditado muda-se em Definições do Sistema › Teclado.';
  if (/Windows/i.test(ua)) return 'No Windows: carrega em Win + H e fala, com o idioma de entrada em inglês.';

/* ---------- ecrã sempre ligado durante a conversa ---------- */
async function wakeOn() {
  if (S.wake || !('wakeLock' in navigator)) return;
  try {
    const lock = await navigator.wakeLock.request('screen');
    S.wake = lock;
    lock.addEventListener('release', () => { if (S.wake === lock) S.wake = null; });
  } catch { S.wake = null; }
}
function wakeOff() { const l = S.wake; S.wake = null; if (l) { try { l.release(); } catch {} } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { tts.stop(); return; }
  if (S.mode === 'convo' && S.session && !S.session.ended) wakeOn();
});

// Aceita: linhas "inglês = português", o JSON desta app, ou JSON de outra app
// (ex.: cópia de segurança da EscolaPlay) — procura listas de pares en/pt.
const EN_KEYS = ['en', 'english', 'phrase', 'expression', 'term', 'front', 'better', 'eng', 'text_en', 'en_text'];
const PT_KEYS = ['pt', 'portuguese', 'translation', 'traducao', 'tradução', 'back', 'meaning', 'pt_text', 'text_pt', 'definition'];
function pickKey(o, keys) {
  for (const k of keys) { if (typeof o[k] === 'string' && str(o[k])) return str(o[k]); }
  return '';
}
function collectPairs(v, out, depth) {
  if (v == null || depth > 7 || out.length >= 3000) return;
  if (Array.isArray(v)) { for (const x of v) collectPairs(x, out, depth + 1); return; }
  if (typeof v !== 'object') return;
  const en = pickKey(v, EN_KEYS);
  if (en && en.length <= 300) {
    out.push({ kind: str(v.kind) === 'fix' || str(v.you) ? 'fix' : 'phrase', en, pt: pickKey(v, PT_KEYS), you: str(v.you), why: str(v.why), scene: str(v.scene) || 'Importado' });
    return;
  }
  for (const k of Object.keys(v)) collectPairs(v[k], out, depth + 1);
}
function parseImport(text) {
  const t = str(text);
  const out = [];
  if (!t) return out;
  if (/^[\[{]/.test(t)) {
    try { collectPairs(JSON.parse(t), out, 0); } catch {}
    if (out.length) return out;
  }
  for (const line of t.split(/\r?\n/)) {
    const l = line.trim();
    if (!l || l.startsWith('#') || /^[\[{]/.test(l)) continue;
    const parts = l.split(/\s*(?:=|\t|;|\|)\s*|\s+[—–]\s+/);
    const en = str(parts[0]);
    if (en) out.push({ kind: 'phrase', en, pt: str(parts.slice(1).join(' — ')), scene: 'Importado' });
  }
  return out;
}

        : plural(learnerCount(s), 'resposta tua', 'respostas tuas') + (s.ended ? ' · sem avaliação' : ' · a meio')),
      h('div', { class: 'row' },
        h('button', { class: 'chip', type: 'button', 'aria-expanded': String(open), onclick: () => { S.histOpen = open ? null : s.id; renderHistory(); } }, open ? 'Fechar' : 'Ver'),
        S.session && S.session.id === s.id && !S.session.ended
          ? h('button', { class: 'chip', type: 'button', onclick: () => openConvo() }, 'Continuar')
          : !s.report && learnerCount(s) >= 2 && hasClaude ? h('button', { class: 'chip', type: 'button', onclick: () => { S.histOpen = s.id; renderHistory(); const m = $('#rep-' + s.id); if (m) runReport(asSession(s), m); } }, 'Avaliar') : null,
        S.confirmDel === s.id
          ? h('button', { class: 'chip danger', type: 'button', onclick: () => { S.confirmDel = null; if (S.session && S.session.id === s.id) closeSession(); data.removeSession(s.id); } }, 'Apagar?')
          : h('button', { class: 'chip', type: 'button', 'aria-label': 'Apagar sessão', onclick: () => { S.confirmDel = s.id; renderHistory(); } }, icon('trash')))));
  if (open) {
    const body = h('div', { class: 'sess-body' });
    const repMount = h('div', { id: 'rep-' + s.id });
    if (s.report) repMount.append(reportNode(s.report, asSession(s), null));
    body.append(repMount);
    const mini = h('div', { class: 'transcript-mini' });
    for (const t of (s.turns || [])) {
      mini.append(h('p', { lang: 'en' }, h('b', null, t.r === 't' ? whoShort(asSession(s)) + ': ' : 'Tu: '), t.x));
      if (t.r === 'm' && t.f) mini.append(h('p', { class: 'fix-why' }, '→ ', h('span', { lang: 'en' }, t.f.better), t.f.why ? ' — ' + t.f.why : ''));
    }
    body.append(mini);
    row.append(body);
  }
  return row;
}
function asSession(s) {
  return { id: s.id, scene: s.scene || { title: 'Conversa', titleEn: 'Conversation', who: 'Tutor', aim: '', phrases: [] }, level: s.level || 'B1', turns: Array.isArray(s.turns) ? s.turns : [], startedAt: s.startedAt, updatedAt: s.updatedAt, ended: true, report: s.report || null };
}

/* ================================================================
   Definições
   ================================================================ */
function switchRow(id, label, hintTxt, checked, onChange) {
  const input = h('input', { type: 'checkbox', id, role: 'switch' });
  input.checked = !!checked;
  input.addEventListener('change', () => onChange(input.checked));
  return h('label', { class: 'switch', for: id }, h('span', null, h('b', null, label), hintTxt ? h('small', { class: 'muted' }, hintTxt) : null), input);
}
function radioChoice(name, options, value, onChange) {
  const box = h('div', { class: 'choice', role: 'radiogroup' });
  for (const [v, label, note] of options) {
    const input = h('input', { type: 'radio', name, id: name + '-' + v, value: v });
    input.checked = value === v;
    input.addEventListener('change', () => { if (input.checked) onChange(v); });
    box.append(h('label', { for: name + '-' + v }, input, h('b', null, label), note ? h('small', null, note) : h('small')));
  }
  return box;
}
function field(label, ...content) { return h('div', { class: 'field' }, h('span', { class: 'lbl' }, label), content); }

function renderSettings() {
  const sh = E.sheet;
  const keepScroll = sh.scrollTop;
  sh.textContent = '';
  sh.append(h('div', { class: 'sheet-head' }, h('h2', { id: 'settings-title' }, 'Definições'),
    h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Fechar definições', onclick: closeSettings }, icon('close'))));

  sh.append(field('Nível de inglês', levelSeg(renderSettings),
    h('span', { class: 'hint-txt' }, LEVELS[settings.level].name + '. O nível muda o vocabulário, a velocidade da voz e o rigor das correções.')));

  sh.append(field('Sotaque', radioChoice('accent', [['en-GB', 'Britânico', 'Mais comum em projetos na Europa'], ['en-US', 'Americano', '']], settings.accent,
    v => { settings.accent = v; settings.voiceURI = ''; saveSettings(); renderSettings(); })));

  // Voz do tutor: Mistral pelo conector, com a do dispositivo como alternativa
  const st = mistralStatus();
  const engineField = field('Voz do tutor', radioChoice('engine', [
    ['mistral', 'Mistral (Voxtral)', 'Voz natural do Mistral, pelo teu conector «Voz Mistral». Se falhar, uso a voz do dispositivo.'],
    ['device', 'Voz do dispositivo', 'O sintetizador do telemóvel ou do computador. Funciona sempre, sem configurar nada.'],
  ], settings.engine, v => { settings.engine = v; saveSettings(); tts.stop(); renderSettings(); }));
  if (settings.engine === 'mistral') {
    engineField.append(h('p', { class: 'status-line ' + st.cls, role: 'status' }, st.text));
    const mv = h('select', { id: 'mistral-voice', 'aria-label': 'Voz Mistral' });
    mv.append(h('option', { value: '' }, 'Automática — ' + (settings.accent === 'en-US' ? 'Paul, americano' : 'Oliver, britânico')));
    const seen = new Set();
    const addVoice = (id, label) => {
      if (!/^[A-Za-z0-9_.-]{1,64}$/.test(id) || seen.has(id)) return;
      seen.add(id);
      const o = h('option', { value: id }, label);
      if (id === settings.mistralVoice) o.selected = true;
      mv.append(o);
    };
    for (const v of MISTRAL_VOICES) addVoice(v.id, v.name);
    const loaded = store.get('mistralVoices', []);
    for (const v of Array.isArray(loaded) ? loaded : []) addVoice(str(v && v.id), [str(v && v.id), str(v && v.name), str(v && v.language)].filter(Boolean).join(' · '));
    mv.addEventListener('change', () => { settings.mistralVoice = mv.value; saveSettings(); sayPhrase(SAMPLE_LINE); });
    const loadBtn = h('button', { class: 'chip', type: 'button' }, 'Carregar vozes da conta');
    loadBtn.addEventListener('click', () => loadMistralVoices(loadBtn));
    const row = h('div', { class: 'row' },
      h('button', { class: 'chip', type: 'button', onclick: () => sayPhrase(SAMPLE_LINE) }, icon('play'), 'Ouvir exemplo'), loadBtn);
    if (hasClaude && (MISTRAL_OFF.has(vm.state) || vm.state === 'limit' || vm.state === 'error') && vm.state !== 'unavailable') {
      row.append(h('button', { class: 'chip', type: 'button', onclick: () => {
        vm.state = 'ready'; vm.cooldownUntil = 0; vm.lastError = ''; shownOnce.clear();
        sayPhrase(SAMPLE_LINE);
        renderSettings();
      } }, 'Tentar outra vez'));
    }
    engineField.append(mv, row, setupSteps());
  }
  sh.append(engineField);

  const select = h('select', { id: 'voice-select', 'aria-label': 'Voz do dispositivo' });
  select.append(h('option', { value: '' }, 'Automática — a melhor disponível'));
  for (const v of tts.ranked()) {
    const o = h('option', { value: v.voiceURI }, v.name + ' (' + v.lang + ')');
    if (v.voiceURI === settings.voiceURI) o.selected = true;
    select.append(o);
  }
  select.addEventListener('change', () => { settings.voiceURI = select.value; saveSettings(); sayPhrase('Hi! Shall we practise for a few minutes?', 1, 'device'); });
  const picked = tts.pick();
  sh.append(field(settings.engine === 'mistral' ? 'Voz do dispositivo (alternativa)' : 'Voz do dispositivo',
    tts.ok && tts.voices.length ? select : h('span', { class: 'hint-txt' }, tts.ok ? 'Este dispositivo ainda não mostrou vozes em inglês. Se não aparecer nenhuma, instala uma voz inglesa nas definições do sistema.' : 'Este browser não tem síntese de voz; sem a voz Mistral, as respostas ficam só em texto.'),
    h('span', { class: 'hint-txt' }, (picked ? 'A usar: ' + picked.name + '. ' : '') + 'Para uma voz mais natural: no iPhone e no Mac descarrega uma voz inglesa «Melhorada» ou «Premium» (Acessibilidade › Conteúdo falado › Vozes); no Windows, abre o claude.ai no Microsoft Edge, que tem vozes «Natural».')));

  const out = h('output', { for: 'rate' }, settings.rate.toFixed(2).replace('.', ',') + '×');
  const range = h('input', { type: 'range', id: 'rate', min: '0.7', max: '1.3', step: '0.05', value: String(settings.rate), 'aria-label': 'Velocidade da voz' });
  range.addEventListener('input', () => { settings.rate = Number(range.value) || 1; out.textContent = settings.rate.toFixed(2).replace('.', ',') + '×'; saveSettings(); });
  sh.append(field('Velocidade da voz', h('div', { class: 'range' }, range, out,
    h('button', { class: 'chip', type: 'button', onclick: () => sayPhrase("Let's walk through the standard process first, and then we'll look at the gaps.") }, icon('play'), 'Ouvir exemplo'))));

  sh.append(h('div', { class: 'field' },
    switchRow('sw-speak', 'Ler as respostas em voz alta', 'O tutor fala assim que responde.', settings.autoSpeak, v => { settings.autoSpeak = v; saveSettings(); if (!v) tts.stop(); }),
    switchRow('sw-pt', 'Explicações em português', 'O porquê de cada correção vem em português de Portugal.', settings.ptHelp, v => { settings.ptHelp = v; saveSettings(); }),
    switchRow('sw-auto', 'Enviar sozinho depois do ditado', 'Envia 3 segundos depois de parares de falar. Útil para responder só com a voz.', settings.autoSend, v => { settings.autoSend = v; saveSettings(); })));

  sh.append(field('Modelo do Claude', radioChoice('tier', [
    ['quick', 'Rápido', 'Responde em 1 a 3 segundos. O melhor para conversar.'],
    ['default', 'Profundo', 'Mais cuidadoso, mas cada resposta demora 5 a 60 segundos.'],
  ], settings.tier, v => { settings.tier = v; saveSettings(); })));

  sh.append(h('div', { class: 'about' },
    h('p', null, h('b', null, 'Custos: '), 'a app usa o Claude da tua conta e gasta a quota do teu plano, como uma conversa normal. Não usa a API nem chaves, por isso não há custos extra. A voz Mistral passa pelo teu conector (um Worker grátis na Cloudflare) e usa o plano grátis do Mistral.'),
    h('p', null, h('b', null, 'Dados: '), data.synced
      ? 'o caderno e as sessões ficam guardados nesta app do claude.ai, só para ti, e aparecem em todos os teus dispositivos.'
      : 'o caderno e as sessões estão guardados só neste dispositivo.'),
    h('p', null, h('b', null, 'Avaliação: '), 'no fim de cada sessão o Claude usa o modelo normal (mais cuidadoso) para rever a conversa inteira.')));
  sh.scrollTop = keepScroll;
}
const SAMPLE_LINE = "Good morning, everyone. Let's walk through the standard process first, and then we'll look at the gaps.";
function setupSteps() {
  return h('details', { class: 'setup' },
    h('summary', null, 'Como ligar a voz Mistral (uma vez, cerca de 5 minutos)'),
    h('ol', null,
      h('li', null, 'Publica o Worker que está em ', h('code', null, 'tutor-ingles/voz-mistral'), ' no repositório escolaplay, como fizeste com o tts-proxy:',
        h('code', { class: 'cmd' }, 'npx wrangler login\nnpx wrangler secret put MISTRAL_API_KEY\nnpx wrangler secret put ACCESS_TOKEN\nnpx wrangler deploy')),
      h('li', null, 'Em MISTRAL_API_KEY cola a tua chave Mistral (a mesma da EscolaPlay). Em ACCESS_TOKEN inventa um código longo, só com letras e números: é ele que protege o conector.'),
      h('li', null, 'No claude.ai: Personalizar › Conectores › Adicionar conector personalizado. Nome: ', h('b', null, 'Voz Mistral'),
        '. URL: ', h('code', null, 'https://tutor-voz-mistral.<a-tua-conta>.workers.dev/mcp/<ACCESS_TOKEN>'),
        '. Autenticação: sem início de sessão (No sign-in).'),
      h('li', null, 'Volta aqui, toca em «Ouvir exemplo» e aceita o pedido de acesso ao conector.')),
    h('p', { class: 'hint-txt' }, 'A chave Mistral fica guardada no Worker e nunca passa por esta página.'));
}
async function loadMistralVoices(btn) {
  btn.disabled = true;
  try {
    const m = vm.mcp || await mcpPromise;
    if (!m) throw { code: 'capability_disabled' };
    const r = await m.callTool(MISTRAL_SERVER, 'voices', {});
    const raw = r && r.payload && Array.isArray(r.payload.voices) ? r.payload.voices : [];
    const list = raw.map(v => ({ id: str(v && v.id), name: str(v && v.name), language: str(v && v.language) }))
      .filter(v => /^[A-Za-z0-9_.-]{1,64}$/.test(v.id)).slice(0, 200);
    if (!list.length) throw { code: 'tool_error', message: 'A conta Mistral não devolveu vozes.' };
    store.set('mistralVoices', list);
    if (vm.state !== 'ok') { vm.state = 'ok'; vm.lastError = ''; }
    toast(plural(list.length, 'voz carregada', 'vozes carregadas'));
  } catch (e) {
    if (errCode(e) === 'tool_error' || errCode(e) === 'server_unavailable' || errCode(e) === 'upstream_error') {
      toast('Não consegui carregar as vozes' + (str(e && e.message) ? ': ' + str(e.message).slice(0, 90) : ''));
    } else {
      noteMistralFailure(e);
    }
  }
  renderSettings();
}
let lastFocus = null;
function openSettings() { lastFocus = document.activeElement; tts.load(); renderSettings(); E.settings.hidden = false; const c = E.sheet.querySelector('.sheet-head .icon-btn'); if (c) c.focus(); }
function closeSettings() { E.settings.hidden = true; renderSub(); if (S.view === 'practice' && S.mode === 'start') renderStart(); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$('#btn-settings').addEventListener('click', openSettings);
E.settings.addEventListener('click', e => { if (e.target === E.settings) closeSettings(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !E.settings.hidden) closeSettings(); });

/* ================================================================
   Arranque
   ================================================================ */
(function boot() {
  const cur = store.get('current', null);
  if (cur && typeof cur === 'object' && cur.id && cur.scene && Array.isArray(cur.turns) && !cur.ended && Date.now() - (cur.updatedAt || 0) < 3 * 864e5) {
    S.session = cur;
  } else if (cur) {
    store.del('current');
  }
  E.nbCount.textContent = String(data.notebook.length);
  renderSub();
  renderStart();
  updateComposer();
})();
})();
</script>
