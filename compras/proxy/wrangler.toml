name = "compras"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# não apagar as variáveis postas no painel do Cloudflare a cada publicação (os segredos ficam sempre)
keep_vars = true

# A casa, os aparelhos (só o hash do segredo de cada um), a lista de cada casa e o índice de cada cadeia
# (criado com: POST /accounts/:id/storage/kv/namespaces {"title":"compras-KV"}).
# A KV grátis dá 1000 gravações por dia à conta toda (as outras apps também): grava-se pouco (ver src/casa.js).
[[kv_namespaces]]
binding = "KV"
id = "77a28aa5db2e4dce99d3275282b8f540"

[vars]
# Só a app cria aparelhos (a origem dela)
ALLOWED_ORIGINS = "https://nelsonsous.github.io"
APP_URL = "https://nelsonsous.github.io/escolaplay/compras/"

# O segredo da sonda (volta 1), longo e ao acaso:
#   openssl rand -hex 24 | npx wrangler secret put SONDA_TOKEN
# Sem ele a sonda fica desligada (503); a app não precisa dele.
