<script>
(function(){
  var cv=document.getElementById('c'),err=document.getElementById('err'),hint=document.getElementById('hint');
  var gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
  if(!gl){err.style.display='grid';return;}
  var VS='#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';
  function sh(ty,s){var o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){err.textContent='Shader: '+gl.getShaderInfoLog(o);err.style.display='grid';throw 0;}return o;}
  var pr=gl.createProgram();
  try{gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('frag').textContent));}catch(e){return;}
  gl.linkProgram(pr); if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){err.textContent='Erro ao ligar o shader.';err.style.display='grid';return;}
  gl.useProgram(pr); var uLoc=gl.getUniformLocation(pr,'u'); gl.bindVertexArray(gl.createVertexArray());
  var cpuField=null; try{cpuField=(new Function(document.getElementById('cpufield').textContent))();}catch(e){}

  var W=1,H=1;
  function resize(){var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    var s=Math.max(64,Math.min(Math.round(Math.min(r.width,r.height)*dpr),820));if(s!==W){W=H=s;cv.width=W;cv.height=H;gl.viewport(0,0,W,H);}}
  window.addEventListener('resize',resize,{passive:true});

  var tx=0.5,ty=0.5,touched=false,lastTouch=0;
  function setPt(e){var r=cv.getBoundingClientRect(),p=(e.touches&&e.touches[0])||e;
    tx=Math.max(0,Math.min(1,(p.clientX-r.left)/r.width));ty=Math.max(0,Math.min(1,(p.clientY-r.top)/r.height));
    touched=true;lastTouch=performance.now();hint.classList.add('gone');}
  cv.addEventListener('pointerdown',function(e){cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);setPt(e);},{passive:true});
  cv.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')setPt(e);},{passive:true});
  window.addEventListener('pointerup',function(){touched=false;},{passive:true});

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0=performance.now(),facc=0,flast=t0,cur=0,fpsEl=document.getElementById('fps'),frames=0,measured=false;

  function measureCPU(){
    if(!cpuField){document.getElementById('cfps').textContent='n/d';return;}
    var N=72,t=(performance.now()-t0)/1000,warm=0;
    try{for(var i=0;i<200;i++)warm+=cpuField((i*37)%W,(i*53)%H,t,W,H,tx*W,ty*H);}catch(e){document.getElementById('cfps').textContent='n/d';return;}
    var s=performance.now(),acc=0;
    for(var yy=0;yy<N;yy++)for(var xx=0;xx<N;xx++)acc+=cpuField(xx/N*W,yy/N*H,t,W,H,tx*W,ty*H);
    var ms=performance.now()-s;if(ms<=0)ms=0.01;
    var cpuFps=(N*N)/ms*1000/(W*H);
    if(warm===98765)console.log(acc);
    var r=cur/Math.max(cpuFps,1e-4);
    document.getElementById('cfps').innerHTML=(cpuFps>=1?Math.round(cpuFps):cpuFps.toFixed(1))+' fps — a GPU é '+(r>=10?Math.round(r):r.toFixed(1))+'× mais rápida.';
    measured=true;
  }
  function frame(now){
    resize();
    var t=(now-t0)/1000*(reduce?0.35:1);
    if(!touched && now-lastTouch>1100){var a=now/1000*0.3;tx=0.5+0.3*Math.cos(a);ty=0.5+0.3*Math.sin(a*1.3);}
    gl.uniform1fv(uLoc,[t,W,H,tx*W,ty*H,0,0,0]); gl.drawArrays(gl.TRIANGLES,0,3);
    facc++;frames++;
    if(now-flast>=500){var fps=facc*1000/(now-flast);facc=0;flast=now;cur=cur?cur*0.6+fps*0.4:fps;fpsEl.textContent=Math.round(cur);}
    if(!measured && frames===45){setTimeout(measureCPU,0);}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function(){hint.classList.add('gone');},4600);
})();
