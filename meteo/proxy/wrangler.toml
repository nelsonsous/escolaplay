name = "meteo"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Locais, análises do Claude, lições e histórico de observações
# (criado com: POST /accounts/:id/storage/kv/namespaces {"title":"meteo-METEO"})
[[kv_namespaces]]
binding = "KV"
id = "df3dfce3ae1b40cdb97071b58df3e7b0"

[vars]
# Origens que podem gravar (locais, análise imediata); a leitura é livre
ALLOWED_ORIGINS = "https://nelsonsous.github.io"
APP_URL = "https://nelsonsous.github.io/escolaplay/meteo/"
CLAUDE_MODEL = "claude-opus-5-5"

# Opcional — análise imediata pela API do Claude (botão "Analisar agora"):
#   npx wrangler secret put ANTHROPIC_API_KEY

# Código do dono da app (Ajustes → Utilização, gerir os locais de todos; a app recebe-o uma vez com ?dono=<código>).
# Nunca aqui: só como segredo, longo e ao acaso (ex.: openssl rand -hex 16). Sem ele ninguém é o dono.
#   npx wrangler secret put OWNER_CODE
