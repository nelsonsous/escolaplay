name = "compras"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# não apagar as variáveis postas no painel do Cloudflare a cada publicação (os segredos ficam sempre)
keep_vars = true

# O índice de cada cadeia (o Ecónomo grava-o; criado com: POST /accounts/:id/storage/kv/namespaces {"title":"compras-KV"}).
# Até à volta 2 também tinha a casa e a lista, que passaram para a D1: a KV grátis dá só 1000 gravações por dia à
# conta toda (as outras apps também).
# a IA da Cloudflare: lê as fotografias dos talões (src/talao.js); partilha os 10 000 neurónios por dia com a Música
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "KV"
id = "4d9eaf4eafa74a89866401b07611cd05"

# a casa, os aparelhos (só o hash do segredo de cada um), a lista de cada casa e os preços (volta 3; as tabelas em
# migrations/, aplicadas com: npx wrangler d1 migrations apply compras --remote)
[[d1_databases]]
binding = "DB"
database_name = "compras"
database_id = "41757f2b-e831-4b91-8da9-7d80a76a42df"
migrations_dir = "migrations"

# de dois em dois minutos: aos minutos redondos os preços velhos dos produtos das listas (src/precos.js); nos outros,
# uma página de categoria de uma cadeia, à vez (src/catalogo.js)
[triggers]
crons = ["*/2 * * * *"]

[vars]
# Só a app cria aparelhos (a origem dela)
ALLOWED_ORIGINS = "https://nelsonsous.github.io"
APP_URL = "https://nelsonsous.github.io/escolaplay/compras/"

# O segredo da sonda (volta 1), longo e ao acaso:
#   openssl rand -hex 24 | npx wrangler secret put SONDA_TOKEN
# Sem ele a sonda fica desligada (503); a app não precisa dele.
