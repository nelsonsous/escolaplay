<meta name="claude:viewport-fit-sides" content="cover">
<title>Sudoku da Eduarda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* Sudoku calmo para crianças: fundo pastel fixo, grelha grande, números a cores. Claro por omissão, com variante escura. */
  :root{
    --bg1:#eef4ff; --bg2:#fdeefb; --panel:#ffffff; --ink:#24304a; --mut:#6b7794; --line:#d6ddea; --box:#9aa6be;
    --sel:#dcebff; --sel-br:#4a90ff; --given:#eef1f7; --conf:#ffe0e0; --conf-br:#ef4444; --good:#22c55e;
    --n1:#e23b3b; --n2:#e8820c; --n3:#1ca35a; --n4:#2f74e6; --n5:#9b46d6; --n6:#e0458f; --n7:#0ea5a5; --n8:#f0640a; --n9:#5a5fe0;
    color-scheme:light;
    --f:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg1:#111726;--bg2:#1a1230;--panel:#1c2336;--ink:#eef2fb;--mut:#a7b1c8;--line:#313c54;--box:#66738f;
    --sel:#223a63;--sel-br:#5a93ff;--given:#232c42;--conf:#4a2230;--conf-br:#ff8080;
    color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg1:#111726;--bg2:#1a1230;--panel:#1c2336;--ink:#eef2fb;--mut:#a7b1c8;--line:#313c54;--box:#66738f;
    --sel:#223a63;--sel-br:#5a93ff;--given:#232c42;--conf:#4a2230;--conf-br:#ff8080;color-scheme:dark}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font:17px/1.4 var(--f);min-height:100%;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:max(16px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-bottom,0px))}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;text-align:center}
  h1 small{display:block;font-size:14px;font-weight:700;color:var(--mut)}
  .levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .lv{font:800 15px var(--f);color:var(--mut);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer}
  .lv.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,#4a90ff,#9b46d6)}
  .board{align-self:center;width:100%;max-width:400px;aspect-ratio:1;background:var(--box);border:3px solid var(--box);border-radius:14px;
    display:grid;gap:0;overflow:hidden;box-shadow:0 14px 34px -18px rgba(40,50,90,.4)}
  .cell{background:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;
    border:1px solid var(--line);user-select:none;line-height:1;font-variant-numeric:tabular-nums}
  .cell.sel{background:var(--sel);box-shadow:inset 0 0 0 3px var(--sel-br)}
  .cell.given{background:var(--given)}
  .cell.conf{background:var(--conf);box-shadow:inset 0 0 0 2px var(--conf-br)}
  .cell.hl{background:var(--sel)}
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .pad.six{grid-template-columns:repeat(6,1fr)} .pad.nine{grid-template-columns:repeat(5,1fr)}
  .num{font:800 clamp(20px,6vw,26px)/1 var(--f);background:var(--panel);border:2px solid var(--line);border-radius:14px;
    padding:14px 0;cursor:pointer;box-shadow:0 5px 0 -1px rgba(40,50,90,.12)}
  .num:active{transform:translateY(2px)}
  .tools{display:flex;gap:9px}
  .tool{flex:1;font:800 16px var(--f);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 0;cursor:pointer}
  .tool:active{transform:translateY(2px)}
  .tool.go{color:#fff;border-color:transparent;background:linear-gradient(120deg,#f59e0b,#e0458f)}
  .status{text-align:center;font-weight:800;min-height:26px;font-size:17px;color:var(--mut)}
  .status.win{color:var(--good);font-size:20px}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="fx"></canvas>
<div class="wrap">
  <h1>Sudoku <small>da Eduarda</small></h1>
  <div class="levels" id="levels">
    <button class="lv on" data-n="4">🟢 Fácil · 4×4</button>
    <button class="lv" data-n="6">🔵 Médio · 6×6</button>
    <button class="lv" data-n="9">🟣 Crescido · 9×9</button>
  </div>
  <div class="board" id="board"></div>
  <div class="pad" id="pad"></div>
  <div class="tools">
    <button class="tool" id="erase">🧽 Apagar</button>
    <button class="tool" id="hint">💡 Dica</button>
    <button class="tool go" id="novo">✨ Novo</button>
  </div>
  <div class="status" id="status">Toca numa casa e depois num número.</div>
</div>

<script>
(function(){
  var board=document.getElementById('board'), pad=document.getElementById('pad'), statusEl=document.getElementById('status');
  var NCOL=['','var(--n1)','var(--n2)','var(--n3)','var(--n4)','var(--n5)','var(--n6)','var(--n7)','var(--n8)','var(--n9)'];
  var N=4, bR=2, bC=2, sol=[], grid=[], given=[], sel=-1;
  var CFG={4:[2,2,7],6:[2,3,18],9:[3,3,45]};   // [boxRows, boxCols, cellsToRemove]

  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function genFull(){
    var g=[]; for(var i=0;i<N;i++){g.push(new Array(N).fill(0));}
    function ok(r,c,v){ for(var i=0;i<N;i++){ if(g[r][i]===v||g[i][c]===v) return false; }
      var r0=((r/bR)|0)*bR, c0=((c/bC)|0)*bC;
      for(var a=0;a<bR;a++)for(var b=0;b<bC;b++) if(g[r0+a][c0+b]===v) return false; return true; }
    function fill(p){ if(p===N*N) return true; var r=(p/N)|0,c=p%N, nums=shuffle(Array.from({length:N},function(_,i){return i+1;}));
      for(var k=0;k<nums.length;k++){ var v=nums[k]; if(ok(r,c,v)){ g[r][c]=v; if(fill(p+1)) return true; g[r][c]=0; } } return false; }
    fill(0); return g;
  }
  function conflict(r,c){ var v=grid[r][c]; if(!v) return false;
    for(var i=0;i<N;i++){ if(i!==c && grid[r][i]===v) return true; if(i!==r && grid[i][c]===v) return true; }
    var r0=((r/bR)|0)*bR, c0=((c/bC)|0)*bC;
    for(var a=0;a<bR;a++)for(var b=0;b<bC;b++){ var rr=r0+a,cc=c0+b; if((rr!==r||cc!==c)&&grid[rr][cc]===v) return true; } return false; }

  function newGame(){
    var cfg=CFG[N]; bR=cfg[0]; bC=cfg[1];
    sol=genFull(); grid=sol.map(function(row){return row.slice();}); given=[];
    for(var i=0;i<N;i++) given.push(new Array(N).fill(true));
    var cells=shuffle(Array.from({length:N*N},function(_,i){return i;})).slice(0,cfg[2]);
    cells.forEach(function(p){ var r=(p/N)|0,c=p%N; grid[r][c]=0; given[r][c]=false; });
    sel=-1; buildBoard(); buildPad(); statusEl.className='status'; statusEl.textContent='Toca numa casa e depois num número.';
  }
  function buildBoard(){
    board.style.gridTemplateColumns='repeat('+N+',1fr)';
    board.style.fontSize=(N===9?'min(6.4vw,26px)':N===6?'min(8.5vw,34px)':'min(12vw,46px)');
    board.innerHTML='';
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var d=document.createElement('div'); d.className='cell'+(given[r][c]?' given':''); d.dataset.r=r; d.dataset.c=c;
      d.style.borderRight=((c+1)%bC===0&&c<N-1)?'3px solid var(--box)':'';
      d.style.borderBottom=((r+1)%bR===0&&r<N-1)?'3px solid var(--box)':'';
      d.onclick=(function(r,c){return function(){ if(given[r][c]){ sel=-1; } else { sel=r*N+c; } render(); };})(r,c);
      board.appendChild(d);
    }
    render();
  }
  function buildPad(){
    pad.className='pad'+(N===6?' six':N===9?' nine':''); pad.innerHTML='';
    for(var v=1;v<=N;v++){ var b=document.createElement('button'); b.className='num'; b.textContent=v; b.style.color=NCOL[v];
      b.onclick=(function(v){return function(){ place(v); };})(v); pad.appendChild(b); }
  }
  function place(v){ if(sel<0){ statusEl.textContent='Primeiro toca numa casa vazia 🙂'; return; }
    var r=(sel/N)|0,c=sel%N; if(given[r][c]) return; grid[r][c]=v; render(); checkWin(); }
  function erase(){ if(sel<0) return; var r=(sel/N)|0,c=sel%N; if(given[r][c]) return; grid[r][c]=0; render(); }
  function hint(){ var empties=[]; for(var r=0;r<N;r++)for(var c=0;c<N;c++) if(!grid[r][c]) empties.push(r*N+c);
    if(!empties.length) return; var p=empties[(Math.random()*empties.length)|0], r=(p/N)|0,c=p%N;
    grid[r][c]=sol[r][c]; given[r][c]=true; sel=-1; buildBoard(); checkWin(); statusEl.textContent='Aqui tens uma ajuda 💡'; }

  function render(){
    var cells=board.children, selR=sel>=0?(sel/N)|0:-1, selC=sel>=0?sel%N:-1;
    for(var i=0;i<cells.length;i++){ var r=(i/N)|0,c=i%N, el=cells[i], v=grid[r][c];
      el.textContent=v||''; el.style.color=NCOL[v]||'';
      el.classList.toggle('sel', i===sel);
      el.classList.toggle('hl', sel>=0 && i!==sel && (r===selR||c===selC));
      el.classList.toggle('conf', !given[r][c] && conflict(r,c));
    }
  }
  function checkWin(){
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){ if(!grid[r][c]||conflict(r,c)){ return; } }
    statusEl.className='status win'; statusEl.textContent='🎉 Parabéns, Eduarda! Resolveste!'; confetti(150); sel=-1; render();
  }

  // festa só no fim
  var fx=document.getElementById('fx'), cx=fx.getContext('2d'), parts=[], FW=1,FH=1;
  function rfx(){ var d=Math.min(window.devicePixelRatio||1,2); FW=fx.width=Math.round(innerWidth*d); FH=fx.height=Math.round(innerHeight*d); }
  var COL=['#e23b3b','#e8820c','#1ca35a','#2f74e6','#9b46d6','#e0458f','#f0640a'];
  function confetti(n){ rfx(); for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=4+Math.random()*8;
    parts.push({x:FW/2,y:FH*0.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,life:1,c:COL[(Math.random()*COL.length)|0],r:3+Math.random()*5}); } }
  function loop(){ cx.clearRect(0,0,FW,FH); var d=Math.min(window.devicePixelRatio||1,2);
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.011; if(p.life<=0){parts.splice(i,1);continue;}
      cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r*d,0,6.28); cx.fill(); } cx.globalAlpha=1; requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  document.getElementById('erase').onclick=erase;
  document.getElementById('hint').onclick=hint;
  document.getElementById('novo').onclick=newGame;
  document.getElementById('levels').onclick=function(e){ var b=e.target.closest('.lv'); if(!b) return;
    [].forEach.call(this.children,function(x){x.classList.remove('on');}); b.classList.add('on'); N=+b.dataset.n; newGame(); };
  newGame();
})();
</script>
