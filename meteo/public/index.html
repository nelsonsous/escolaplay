<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meteo Preciso</title>
  <meta name="description" content="Previsão do tempo multi-modelo para a tua localização exata, com observações reais, satélite e análise do Claude.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meteo">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar para a previsão</a>
  <header class="topbar">
    <button id="loc-btn" class="loc-btn" type="button" aria-haspopup="dialog" aria-controls="loc-dialog">
      <svg class="i loc-pin" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span class="loc-text"><span id="loc-name" class="loc-name">Escolher local</span><span id="loc-sub" class="loc-sub"></span></span>
      <svg class="i loc-chev" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5L12 15l5.5-5.5"/></svg>
      <span class="sr-only">— mudar de local</span>
    </button>
    <button id="gps-btn" class="icon-btn" type="button" aria-label="Usar a minha localização exata">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5"/></svg>
    </button>
    <button id="refresh-btn" class="icon-btn" type="button" aria-label="Atualizar previsão">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <div id="banners" class="banners"></div>
    <section id="hero" class="hero hero--loading" aria-live="polite">
      <div class="skel-hero" role="status" aria-label="A carregar…"><span class="sk sk-a"></span><span class="sk sk-b"></span><span class="sk sk-c"></span></div>
    </section>
    <section id="analysis" class="card" hidden></section>
    <section id="alerts" class="alerts" hidden></section>
    <section id="nowcast" class="card" hidden></section>
    <section id="hourly" class="card" hidden></section>
    <section id="indicators" class="card" hidden></section>
    <section id="daily" class="card" hidden></section>
    <section id="fire" class="card" hidden></section>
    <section id="models" class="card" hidden></section>
  </main>
  <footer id="footer" class="footer"></footer>

  <dialog id="loc-dialog" class="sheet" aria-labelledby="loc-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="loc-title">Escolher local</h2>
        <button id="dlg-close" class="icon-btn" type="button" aria-label="Fechar">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </button>
      </div>
      <button id="dlg-gps" class="btn btn-primary btn-block" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5"/></svg>
        <span>Usar a minha localização exata</span>
      </button>
      <label class="search">
        <span class="sr-only">Pesquisar local</span>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="dlg-q" type="search" placeholder="Cidade, vila ou freguesia" autocomplete="off" autocapitalize="words" enterkeyhint="search">
      </label>
      <ul id="dlg-results" class="list" aria-live="polite"></ul>
      <h3 class="sheet-sub">Favoritos</h3>
      <ul id="dlg-favs" class="list"></ul>
      <button id="dlg-fav-add" class="btn btn-ghost btn-block" type="button" hidden></button>
      <h3 class="sheet-sub">Com análise diária do Claude</h3>
      <ul id="dlg-places" class="list"></ul>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
