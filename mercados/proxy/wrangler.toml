name = "mercados-proxy"
main = "src/worker.js"
compatibility_date = "2026-06-01"
# as variáveis de texto criadas no painel do Cloudflare (ex.: CONSELHEIRO_FIRE_URL) ficam ao publicar
keep_vars = true

# Opcional: só aceitar pedidos vindos da tua app (separar por vírgulas)
# [vars]
# ALLOWED_ORIGINS = "https://nelsonsous.github.io"

# Diário das sugestões (criado com: npx wrangler kv namespace create JOURNAL)
[[kv_namespaces]]
binding = "JOURNAL"
id = "7e442625c6b6499ab20d553824304411"

# Histórico em SQL (D1): o KV fica a cache do que a app lê; aqui guarda-se a evolução. Esquema em historico.sql.
[[d1_databases]]
binding = "HIST"
database_name = "mercados-historico"
database_id = "38e1d344-441c-4e1b-b98f-ac2c5d1b3e4d"
